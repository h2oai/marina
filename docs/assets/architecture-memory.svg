<defs><marker id="ah-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-client"/></marker><marker id="ah-net" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-net"/></marker><marker id="ah-engine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-engine"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-agent"/></marker><marker id="ah-memory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-memory"/></marker><marker id="ah-civic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-civic"/></marker><marker id="ah-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-store"/></marker><marker id="ah-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-ext"/></marker><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-neutral"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah"/></marker></defs>
<rect class="bg" x="0" y="0" width="1180" height="742" rx="14"/>
<text class="ink h1" x="32" y="44">Memory: one history, one retrieval surface</text>
<text class="muted h2" x="32" y="66">Every write path lands in one versioned record history; every reader is served through the same five tiers; use is measured and consolidation is checked.</text>
<rect x="24" y="98" width="236" height="330" rx="14" class="s-client" fill="none" stroke-width="1.4" stroke-dasharray="7 5"/>
<rect x="40" y="87" width="117.59000000000002" height="22" rx="11" class="f-client s-client" stroke-width="1.2"/>
<text x="98.79500000000002" y="102" text-anchor="middle" class="t-client gl">Write paths</text>

<rect x="32" y="118" width="220" height="44" rx="8" class="f-client s-client" stroke-width="1.1"/>
<text x="44" y="137" text-anchor="start" class="t-client bt">memory commands</text>
<text x="44" y="154" text-anchor="start" class="muted bm">note · kv · reflect</text>
<rect x="32" y="170" width="220" height="44" rx="8" class="f-client s-client" stroke-width="1.1"/>
<text x="44" y="189" text-anchor="start" class="t-client bt">MCP memory tools</text>
<text x="44" y="206" text-anchor="start" class="muted bm">think · memory</text>
<rect x="32" y="222" width="220" height="44" rx="8" class="f-client s-client" stroke-width="1.1"/>
<text x="44" y="241" text-anchor="start" class="t-client bt">REST</text>
<text x="44" y="258" text-anchor="start" class="muted bm">/mem · /v1/memory</text>
<rect x="32" y="274" width="220" height="44" rx="8" class="f-client s-client" stroke-width="1.1"/>
<text x="44" y="293" text-anchor="start" class="t-client bt">Agent journal</text>
<text x="44" y="310" text-anchor="start" class="muted bm">every message</text>
<rect x="32" y="326" width="220" height="44" rx="8" class="f-client s-client" stroke-width="1.1"/>
<text x="44" y="345" text-anchor="start" class="t-client bt">Judged lessons</text>
<text x="44" y="362" text-anchor="start" class="muted bm">from outcomes</text>
<rect x="32" y="378" width="220" height="44" rx="8" class="f-client s-client" stroke-width="1.1"/>
<text x="44" y="397" text-anchor="start" class="t-client bt">Media text</text>
<text x="44" y="414" text-anchor="start" class="muted bm">captions · OCR · PDFs</text>
<rect x="340" y="112" width="440" height="316" rx="12" class="f-memory s-memory" stroke-width="2"/>
<text x="358" y="140" text-anchor="start" class="t-memory bt">One canonical record history</text>
<text x="358" y="159" text-anchor="start" class="mono t-memory bm">src/persistence/db-memory-service.ts</text>
<rect x="356" y="174" width="408" height="86" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="370" y="196" text-anchor="start" class="t-neutral bt">Versioned records</text>
<text x="370" y="215" text-anchor="start" class="bs ink">provenance · verification · known-at time</text>
<text x="370" y="231.5" text-anchor="start" class="bs ink">a correction is a new version; resolve closes the loser</text>
<text x="370" y="248" text-anchor="start" class="bs ink">tiers: fact · reflection · skill · core · process</text>
<rect x="356" y="270" width="198" height="70" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="370" y="292" text-anchor="start" class="t-neutral bt">Numeric handles</text>
<text x="370" y="311" text-anchor="start" class="bs ink">note #N, pools, ACLs</text>
<text x="370" y="327.5" text-anchor="start" class="bs ink">same SQLite transaction</text>
<rect x="566" y="270" width="198" height="70" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="580" y="292" text-anchor="start" class="t-neutral bt">FTS5 index</text>
<text x="580" y="311" text-anchor="start" class="bs ink">lexical by default;</text>
<text x="580" y="327.5" text-anchor="start" class="bs ink">embeddings evidence-gated</text>
<rect x="356" y="352" width="408" height="60" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="370" y="374" text-anchor="start" class="t-neutral bt">Access</text>
<text x="370" y="393" text-anchor="start" class="bs ink">own space · shared pools · members-only crew pools</text>
<path d="M260,269 L340,269" fill="none" class="ls-client" stroke-width="2.2" marker-end="url(#ah-client)"/>
<rect x="273.68" y="237" width="52.64" height="20" rx="10" class="pill"/>
<text x="300" y="251" text-anchor="middle" class=" al t-client">writes</text>
<rect x="840" y="112" width="308" height="316" rx="12" class="f-agent s-agent" stroke-width="1.6"/>
<text x="856" y="140" text-anchor="start" class="t-agent bt">One retrieval surface</text>
<text x="856" y="159" text-anchor="start" class="mono t-agent bm">buildUnifiedContext</text>
<rect x="856" y="172" width="276" height="24" rx="5" class="bg s-agent" stroke-width="1"/>
<text x="866" y="188.5" text-anchor="start" class="mono t-agent bm">1  [skills]</text>
<rect x="856" y="202" width="258" height="24" rx="5" class="bg s-agent" stroke-width="1"/>
<text x="866" y="218.5" text-anchor="start" class="mono t-agent bm">2  [trusted]</text>
<rect x="856" y="232" width="240" height="24" rx="5" class="bg s-agent" stroke-width="1"/>
<text x="866" y="248.5" text-anchor="start" class="mono t-agent bm">3  [evidence]</text>
<rect x="856" y="262" width="222" height="24" rx="5" class="bg s-agent" stroke-width="1"/>
<text x="866" y="278.5" text-anchor="start" class="mono t-agent bm">4  [proposal]</text>
<rect x="856" y="292" width="204" height="24" rx="5" class="bg s-agent" stroke-width="1"/>
<text x="866" y="308.5" text-anchor="start" class="mono t-agent bm">5  [unverified]</text>
<text x="856" y="338" text-anchor="start" class="muted bs">fixed order, one byte budget</text>
<text x="856" y="358" text-anchor="start" class="muted bs">as-of fence: only what was known</text>
<text x="856" y="384" text-anchor="start" class="ink bs">prompt · recall · /mem/context ·</text>
<text x="856" y="402" text-anchor="start" class="ink bs">MCP context · passthru injection</text>
<path d="M780,269 L840,269" fill="none" class="ls-agent" stroke-width="2.2" marker-end="url(#ah-agent)"/>
<rect x="783.68" y="237" width="52.64" height="20" rx="10" class="pill"/>
<text x="810" y="251" text-anchor="middle" class=" al t-agent">served</text>
<rect x="32" y="484" width="520" height="230" rx="14" class="s-memory" fill="none" stroke-width="1.4"/>
<rect x="348.89" y="473" width="187.11" height="22" rx="11" class="f-memory s-memory" stroke-width="1.2"/>
<text x="442.445" y="488" text-anchor="middle" class="t-memory gl">Usefulness evidence</text>

<rect x="48" y="506" width="150" height="70" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="62" y="528" text-anchor="start" class="t-neutral bt">Served</text>
<text x="62" y="547" text-anchor="start" class="bs ink">one row per item</text>
<text x="62" y="563.5" text-anchor="start" class="mono bm t-neutral" opacity="0.9">memory_served</text>
<rect x="222" y="506" width="314" height="70" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="236" y="528" text-anchor="start" class="t-neutral bt">Raters (mechanical)</text>
<text x="236" y="547" text-anchor="start" class="bs ink">citation · outcome · explicit · unused · repeat</text>
<rect x="48" y="600" width="230" height="96" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="62" y="622" text-anchor="start" class="t-neutral bt">Posterior per item</text>
<text x="62" y="641" text-anchor="start" class="bs ink">(1+α) / (2+α+β)</text>
<text x="62" y="657.5" text-anchor="start" class="bs ink">self-ratings excluded</text>
<text x="62" y="674" text-anchor="start" class="bs ink">for others</text>
<rect x="302" y="600" width="234" height="96" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="316" y="622" text-anchor="start" class="t-neutral bt">Bounded re-rank</text>
<text x="316" y="641" text-anchor="start" class="bs ink">±0.1 on shared retrieval when</text>
<text x="316" y="657.5" text-anchor="start" class="bs ink">ranking is on (observe by</text>
<text x="316" y="674" text-anchor="start" class="bs ink">default); never own notes</text>
<path d="M198,541 L222,541" fill="none" class="ls-memory" stroke-width="1.6" marker-end="url(#ah-memory)"/>
<path d="M379,576 L379.0,582.0 Q379,588 373.0,588.0 L169.0,588.0 Q163,588 163.0,594.0 L163,600" fill="none" class="ls-memory" stroke-width="1.6" marker-end="url(#ah-memory)"/>
<path d="M278,648 L302,648" fill="none" class="ls-memory" stroke-width="1.6" marker-end="url(#ah-memory)"/>
<path d="M994,428 L994.0,448.0 Q994,458 984.0,458.0 L133.0,458.0 Q123,458 123.0,468.0 L123,506" fill="none" class="ls-agent" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-agent)"/>
<rect x="338.44" y="448" width="323.12" height="20" rx="10" class="pill"/>
<text x="500" y="462" text-anchor="middle" class=" al t-agent">every serve is logged — exposure, not usefulness</text>
<rect x="576" y="484" width="572" height="230" rx="14" class="s-memory" fill="none" stroke-width="1.4"/>
<rect x="592" y="473" width="187.11" height="22" rx="11" class="f-memory s-memory" stroke-width="1.2"/>
<text x="685.5550000000001" y="488" text-anchor="middle" class="t-memory gl">Dream pass — hourly</text>

<rect x="592" y="506" width="124.5" height="76" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="602" y="528" text-anchor="start" class="t-neutral bt">Gates</text>
<text x="602" y="547" text-anchor="start" class="bs ink">new notes · quiet</text>
<text x="602" y="563.5" text-anchor="start" class="bs ink">cooldown · budget</text>
<path d="M716.5,544 L730.5,544" fill="none" class="ls-memory" stroke-width="1.6" marker-end="url(#ah-memory)"/>
<rect x="730.5" y="506" width="124.5" height="76" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="740.5" y="528" text-anchor="start" class="t-neutral bt">Gather</text>
<text x="740.5" y="547" text-anchor="start" class="bs ink">own notes</text>
<text x="740.5" y="563.5" text-anchor="start" class="bs ink">+ use evidence</text>
<path d="M855,544 L869,544" fill="none" class="ls-memory" stroke-width="1.6" marker-end="url(#ah-memory)"/>
<rect x="869" y="506" width="124.5" height="76" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="879" y="528" text-anchor="start" class="t-neutral bt">One cheap call</text>
<text x="879" y="547" text-anchor="start" class="bs ink">proposes typed</text>
<text x="879" y="563.5" text-anchor="start" class="bs ink">ops on the notes</text>
<path d="M993.5,544 L1007.5,544" fill="none" class="ls-memory" stroke-width="1.6" marker-end="url(#ah-memory)"/>
<rect x="1007.5" y="506" width="124.5" height="76" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="1017.5" y="528" text-anchor="start" class="t-neutral bt">Checks</text>
<text x="1017.5" y="547" text-anchor="start" class="bs ink">taint · coverage</text>
<text x="1017.5" y="563.5" text-anchor="start" class="bs ink">faithfulness</text>
<rect x="592" y="606" width="263" height="90" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="606" y="628" text-anchor="start" class="t-neutral bt">Apply in a transaction</text>
<text x="606" y="647" text-anchor="start" class="bs ink">re-run probes on that view;</text>
<text x="606" y="663.5" text-anchor="start" class="bs ink">a lost probe rejects the set</text>
<text x="606" y="680" text-anchor="start" class="bs ink">observe (default): roll back</text>
<rect x="869" y="606" width="263" height="90" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="883" y="628" text-anchor="start" class="t-neutral bt">on: keep, or propose</text>
<text x="883" y="647" text-anchor="start" class="bs ink">merge · link · decay applied</text>
<text x="883" y="663.5" text-anchor="start" class="bs ink">supersede → owner adopts</text>
<text x="883" y="680" text-anchor="start" class="bs ink">rollback any time</text>
<path d="M1069.75,582 L1069.8,588.0 Q1069.75,594 1063.8,594.0 L729.5,594.0 Q723.5,594 723.5,600.0 L723.5,606" fill="none" class="ls-memory" stroke-width="1.6" marker-end="url(#ah-memory)"/>
