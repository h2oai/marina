<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 742" width="1180" height="742" role="img" aria-label="Memory architecture: six write paths (memory commands, MCP tools, REST, the agent journal, judged lessons, media text) land in one canonical versioned record history with numeric handles in the same transaction, an FTS5 index and access scopes. One retrieval surface serves five fixed-order tiers within a byte budget to every reader. Each serve is logged; mechanical raters build a per-item posterior that, when ranking is on, re-ranks shared retrieval by at most 0.1. An hourly dream pass proposes typed consolidation ops, checks them mechanically, applies them in a transaction and rolls back in observe mode.">
<title>Memory: one history, one retrieval surface</title>
<desc>Memory architecture: six write paths (memory commands, MCP tools, REST, the agent journal, judged lessons, media text) land in one canonical versioned record history with numeric handles in the same transaction, an FTS5 index and access scopes. One retrieval surface serves five fixed-order tiers within a byte budget to every reader. Each serve is logged; mechanical raters build a per-item posterior that, when ranking is on, re-ranks shared retrieval by at most 0.1. An hourly dream pass proposes typed consolidation ops, checks them mechanically, applies them in a transaction and rolls back in observe mode.</desc>
