<defs><marker id="ah-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-client"/></marker><marker id="ah-net" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-net"/></marker><marker id="ah-engine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-engine"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-agent"/></marker><marker id="ah-memory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-memory"/></marker><marker id="ah-civic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-civic"/></marker><marker id="ah-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-store"/></marker><marker id="ah-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-ext"/></marker><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-neutral"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah"/></marker></defs>
<rect class="bg" x="0" y="0" width="1180" height="640" rx="14"/>
<text class="ink h1" x="32" y="44">How a resident agent thinks</text>
<text class="muted h2" x="32" y="66">A continuous loop: perceive, attend, compose, think, act, record. The agent is a client of the world, never a privileged insider.</text>
<rect x="32" y="110" width="172" height="364" rx="9" class="f-engine s-engine" stroke-width="1.3"/>
<text x="46" y="132" text-anchor="start" class="t-engine bt">Marina server</text>
<text x="46" y="151" text-anchor="start" class="bs ink">the agent is a client:</text>
<text x="46" y="167.5" text-anchor="start" class="bs ink">same protocol, same</text>
<text x="46" y="184" text-anchor="start" class="bs ink">command path, same</text>
<text x="46" y="200.5" text-anchor="start" class="bs ink">gates as a person</text>
<text x="46" y="217" text-anchor="start" class="bs ink"></text>
<text x="46" y="233.5" text-anchor="start" class="mono bm t-engine" opacity="0.9">MarinaClient</text>
<text x="46" y="250" text-anchor="start" class="mono bm t-engine" opacity="0.9">internal token</text>
<rect x="262" y="110" width="648" height="364" rx="14" class="s-agent" fill="none" stroke-width="1.4"/>
<rect x="278" y="99" width="178.42000000000002" height="22" rx="11" class="f-agent s-agent" stroke-width="1.2"/>
<text x="367.21000000000004" y="114" text-anchor="middle" class="t-agent gl">One resident agent</text>

<text x="896" y="106" text-anchor="end" class="mono muted bm">src/agent/lean-agent-adapter.ts</text>
<rect x="282" y="128" width="186" height="132" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="322" y="150" text-anchor="start" class="t-neutral bt">Perceive</text>
<text x="296" y="169" text-anchor="start" class="bs ink">world events arrive:</text>
<text x="296" y="185.5" text-anchor="start" class="bs ink">says, tells, task updates,</text>
<text x="296" y="202" text-anchor="start" class="bs ink">challenge answers</text>
<text x="296" y="218.5" text-anchor="start" class="mono bm t-neutral" opacity="0.9">perceptions</text>
<circle cx="304" cy="145" r="12" class="a-agent"/><text x="304" y="149.3" text-anchor="middle" class="badge" fill="#ffffff">1</text>
<rect x="489" y="128" width="186" height="132" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="529" y="150" text-anchor="start" class="t-neutral bt">Attend</text>
<text x="503" y="169" text-anchor="start" class="bs ink">keep or drop, priority,</text>
<text x="503" y="185.5" text-anchor="start" class="bs ink">owed reply, wake band;</text>
<text x="503" y="202" text-anchor="start" class="bs ink">a pure function</text>
<text x="503" y="218.5" text-anchor="start" class="mono bm t-neutral" opacity="0.9">assessPerception</text>
<circle cx="511" cy="145" r="12" class="a-agent"/><text x="511" y="149.3" text-anchor="middle" class="badge" fill="#ffffff">2</text>
<rect x="696" y="128" width="186" height="132" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="736" y="150" text-anchor="start" class="t-neutral bt">Compose</text>
<text x="710" y="169" text-anchor="start" class="bs ink">stable system prompt</text>
<text x="710" y="185.5" text-anchor="start" class="bs ink">(cached) + a budgeted</text>
<text x="710" y="202" text-anchor="start" class="bs ink">continuation prompt</text>
<text x="710" y="218.5" text-anchor="start" class="mono bm t-neutral" opacity="0.9">6–16 KB, sections</text>
<circle cx="718" cy="145" r="12" class="a-agent"/><text x="718" y="149.3" text-anchor="middle" class="badge" fill="#ffffff">3</text>
<rect x="696" y="324" width="186" height="132" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="736" y="346" text-anchor="start" class="t-neutral bt">Think</text>
<text x="710" y="365" text-anchor="start" class="bs ink">one model turn</text>
<text x="710" y="381.5" text-anchor="start" class="bs ink">via pi-agent-core;</text>
<text x="710" y="398" text-anchor="start" class="bs ink">provider key or</text>
<text x="710" y="414.5" text-anchor="start" class="mono bm t-neutral" opacity="0.9">/v1 marina/cheap</text>
<circle cx="718" cy="341" r="12" class="a-agent"/><text x="718" y="345.3" text-anchor="middle" class="badge" fill="#ffffff">4</text>
<rect x="489" y="324" width="186" height="132" rx="9" class="f-civic s-civic" stroke-width="1.3"/>
<text x="529" y="346" text-anchor="start" class="t-civic bt">Act</text>
<text x="503" y="365" text-anchor="start" class="bs ink">tool call → policy check</text>
<text x="503" y="381.5" text-anchor="start" class="bs ink">→ decision gate (opt-in)</text>
<text x="503" y="398" text-anchor="start" class="bs ink">→ argument check</text>
<text x="503" y="414.5" text-anchor="start" class="bs ink">→ world command</text>
<circle cx="511" cy="341" r="12" class="a-civic"/><text x="511" y="345.3" text-anchor="middle" class="badge" fill="#ffffff">5</text>
<rect x="282" y="324" width="186" height="132" rx="9" class="f-memory s-memory" stroke-width="1.3"/>
<text x="322" y="346" text-anchor="start" class="t-memory bt">Record</text>
<text x="296" y="365" text-anchor="start" class="bs ink">every message journaled</text>
<text x="296" y="381.5" text-anchor="start" class="bs ink">before the loop moves;</text>
<text x="296" y="398" text-anchor="start" class="bs ink">over the cap: archive,</text>
<text x="296" y="414.5" text-anchor="start" class="bs ink">then compact</text>
<circle cx="304" cy="341" r="12" class="a-memory"/><text x="304" y="345.3" text-anchor="middle" class="badge" fill="#ffffff">6</text>
