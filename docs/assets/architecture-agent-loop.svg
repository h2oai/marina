<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" role="img" aria-label="Agent loop: perceptions arrive over WebSocket; a pure attention function decides what wakes the agent; a cached system prompt plus a budgeted continuation prompt with recalled memory is composed; one model turn runs; tool calls pass a policy check, an optional decision gate and an argument check, then reach the server as ordinary world commands under the same gates as a person; every message is journaled before the loop advances. The agent can rest deliberately, reflects when idle, an hourly dream pass proposes and checks consolidation of its notes, and every budget ends in a labelled answer.">
<title>How a resident agent thinks</title>
<desc>Agent loop: perceptions arrive over WebSocket; a pure attention function decides what wakes the agent; a cached system prompt plus a budgeted continuation prompt with recalled memory is composed; one model turn runs; tool calls pass a policy check, an optional decision gate and an argument check, then reach the server as ordinary world commands under the same gates as a person; every message is journaled before the loop advances. The agent can rest deliberately, reflects when idle, an hourly dream pass proposes and checks consolidation of its notes, and every budget ends in a labelled answer.</desc>
