<text x="233" y="178" text-anchor="middle" class=" al t-engine">WebSocket</text>
<path d="M582,456 L582.0,480.0 Q582,490 572.0,490.0 L126.0,490.0 Q118,490 118.0,482.0 L118,474" fill="none" class="ls-civic" stroke-width="1.6" marker-end="url(#ah-civic)"/>
<rect x="250.7" y="480" width="271.6" height="20" rx="10" class="pill"/>
<text x="386.5" y="494" text-anchor="middle" class=" al t-civic">a world command — same gates as a person</text>
<path d="M282,390 L204,390" fill="none" class="ls-memory" stroke-width="1.6" marker-end="url(#ah-memory)"/>
<rect x="203.46" y="360" width="59.080000000000005" height="20" rx="10" class="pill"/>
<text x="233" y="374" text-anchor="middle" class=" al t-memory">journal</text>
<rect x="942" y="128" width="206" height="132" rx="9" class="f-memory s-memory" stroke-width="1.3"/>
<text x="956" y="150" text-anchor="start" class="t-memory bt">Memory</text>
<text x="956" y="169" text-anchor="start" class="bs ink">unified context: five tiers</text>
<text x="956" y="185.5" text-anchor="start" class="bs ink">skills · trusted · evidence</text>
<text x="956" y="202" text-anchor="start" class="bs ink">· proposal · unverified</text>
<text x="956" y="218.5" text-anchor="start" class="mono bm t-memory" opacity="0.9">buildUnifiedContext</text>
<rect x="942" y="324" width="206" height="132" rx="9" class="f-ext s-ext" stroke-width="1.3"/>
<text x="956" y="346" text-anchor="start" class="t-ext bt">Model</text>
<text x="956" y="365" text-anchor="start" class="bs ink">the provider directly, or</text>
<text x="956" y="381.5" text-anchor="start" class="bs ink">Marina's own /v1 with</text>
<text x="956" y="398" text-anchor="start" class="bs ink">tier aliases, spend cap</text>
<text x="956" y="414.5" text-anchor="start" class="bs ink">and route health</text>
<path d="M942,194 L882,194" fill="none" class="ls-memory" stroke-width="1.6" marker-end="url(#ah-memory)"/>
<rect x="885.68" y="164" width="52.64" height="20" rx="10" class="pill"/>
<text x="912" y="178" text-anchor="middle" class=" al t-memory">recall</text>
<path d="M882,390 L942,390" fill="none" class="line" stroke-width="1.6" marker-end="url(#ah-line)" marker-start="url(#ah-line)"/>
<rect x="32" y="536" width="270" height="76" rx="9" class="f-agent s-agent" stroke-width="1.3"/>
<text x="46" y="558" text-anchor="start" class="t-agent bt">Rest deliberately</text>
<text x="46" y="577" text-anchor="start" class="bs ink">a turn acts or rests:</text>
<text x="46" y="593.5" text-anchor="start" class="mono bm t-agent" opacity="0.9">memory set rest &lt;why&gt;</text>
<rect x="314" y="536" width="270" height="76" rx="9" class="f-memory s-memory" stroke-width="1.3"/>
<text x="328" y="558" text-anchor="start" class="t-memory bt">Idle turn</text>
<text x="328" y="577" text-anchor="start" class="bs ink">[Quiet]: one reflection,</text>
<text x="328" y="593.5" text-anchor="start" class="bs ink">a goal update, then rest</text>
<rect x="596" y="536" width="270" height="76" rx="9" class="f-memory s-memory" stroke-width="1.3"/>
<text x="610" y="558" text-anchor="start" class="t-memory bt">Dream (hourly, server)</text>
<text x="610" y="577" text-anchor="start" class="bs ink">proposes consolidation;</text>
<text x="610" y="593.5" text-anchor="start" class="bs ink">applies only when on</text>
<rect x="878" y="536" width="270" height="76" rx="9" class="f-civic s-civic" stroke-width="1.3"/>
<text x="892" y="558" text-anchor="start" class="t-civic bt">Every budget ends</text>
<text x="892" y="577" text-anchor="start" class="bs ink">steer at 75 %, then ask for</text>
<text x="892" y="593.5" text-anchor="start" class="bs ink">the answer, labelled forced</text>
</svg>
