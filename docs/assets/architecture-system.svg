<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 850" width="1180" height="850" role="img" aria-label="System context: people, programs and agents connect to one Marina server process over WebSocket/HTTP, MCP and chat bridges; the engine admits, authorizes and runs every command, calls subsystems, persists to one SQLite database, and reaches model providers, sandboxes, web data and operator alerts outside.">
<title>Marina at a glance</title>
<desc>System context: people, programs and agents connect to one Marina server process over WebSocket/HTTP, MCP and chat bridges; the engine admits, authorizes and runs every command, calls subsystems, persists to one SQLite database, and reaches model providers, sandboxes, web data and operator alerts outside.</desc>
