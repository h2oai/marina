<rect class="bg" x="0" y="0" width="1180" height="738" rx="14"/>
<text class="ink h1" x="32" y="44">How Marina learns</text>
<text class="muted h2" x="32" y="66">Outcomes become judged lessons that are served back to the next attempt. Defaults move only on held-out evidence.</text>
