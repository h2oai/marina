<text x="582" y="177" text-anchor="start" class="bs ink">one judged, general rule —</text>
<text x="582" y="193.5" text-anchor="start" class="bs ink">only trusted rules are served</text>
<path d="M522,292 L534.0,292.0 Q544,292 544.0,282.0 L544.0,182.0 Q544,172 554.0,172.0 L568,172" fill="none" class="ls-memory" stroke-width="1.6" marker-end="url(#ah-memory)"/>
