<text x="326" y="156" text-anchor="start" class="t-neutral bt">Lessons from work</text>
<text x="326" y="175" text-anchor="start" class="bs ink">tool errors · gate holds</text>
<path d="M522,160 L568,160" fill="none" class="ls-memory" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-memory)"/>
