<text x="66" y="589" text-anchor="start" class="bs ink">benchmark ledger (ids and</text>
<text x="66" y="605.5" text-anchor="start" class="bs ink">numbers only) · live work</text>
<path d="M300,591 L328,591" fill="none" class="ls-civic" stroke-width="1.6" marker-end="url(#ah-civic)"/>
<rect x="328" y="548" width="248" height="86" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="342" y="570" text-anchor="start" class="t-neutral bt">Held-out win</text>
<text x="342" y="589" text-anchor="start" class="bs ink">interval above zero, gain</text>
<text x="342" y="605.5" text-anchor="start" class="bs ink">past the fishing margin</text>
<path d="M576,591 L604,591" fill="none" class="ls-civic" stroke-width="1.6" marker-end="url(#ah-civic)"/>
<rect x="604" y="548" width="248" height="86" rx="9" class="f-civic s-civic" stroke-width="1.3"/>
<text x="618" y="570" text-anchor="start" class="t-civic bt">Filed under role.edit</text>
<text x="618" y="589" text-anchor="start" class="bs ink">never by the run's author;</text>
<text x="618" y="605.5" text-anchor="start" class="bs ink">live role-model: a person</text>
<path d="M852,591 L880,591" fill="none" class="ls-civic" stroke-width="1.6" marker-end="url(#ah-civic)"/>
