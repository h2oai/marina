<rect x="48" y="97" width="204.49000000000004" height="22" rx="11" class="f-memory s-memory" stroke-width="1.2"/>
<text x="150.245" y="112" text-anchor="middle" class="t-memory gl">Every outcome teaches</text>

<rect x="52" y="204" width="220" height="52" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="66" y="226" text-anchor="start" class="t-neutral bt">Task verdicts</text>
<text x="66" y="245" text-anchor="start" class="bs ink">approve · bounce</text>
<rect x="52" y="266" width="220" height="52" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="66" y="288" text-anchor="start" class="t-neutral bt">Code Mode checks</text>
<text x="66" y="307" text-anchor="start" class="bs ink">tests and verification</text>
<rect x="52" y="328" width="220" height="52" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="66" y="350" text-anchor="start" class="t-neutral bt">Resolved forecasts</text>
<text x="66" y="369" text-anchor="start" class="bs ink">scored once</text>
<rect x="312" y="230" width="210" height="124" rx="9" class="f-memory s-memory" stroke-width="2"/>
<text x="326" y="252" text-anchor="start" class="t-memory bt">One outcomes row</text>
<text x="326" y="271" text-anchor="start" class="bs ink">append-only, one per subject</text>
<text x="326" y="287.5" text-anchor="start" class="bs ink">numbers and labels,</text>
<text x="326" y="304" text-anchor="start" class="bs ink">never question text</text>
<text x="326" y="320.5" text-anchor="start" class="mono bm t-memory" opacity="0.9">recordResolved</text>
<path d="M272,292 L312,292" fill="none" class="ls-memory" stroke-width="2" marker-end="url(#ah-memory)"/>
