<text x="914" y="242" text-anchor="start" class="t-agent bt">Shared-recall ranking</text>
<text x="914" y="261" text-anchor="start" class="bs ink">a bounded term; observe</text>
<text x="914" y="277.5" text-anchor="start" class="bs ink">mode by default</text>
