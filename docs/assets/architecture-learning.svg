<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 738" width="1180" height="738" role="img" aria-label="Learning loops: task verdicts, Code Mode checks and resolved forecasts each become one append-only outcomes row, while recurring patterns in agents' own work go straight to the lesson learner; durable deliveries feed a judged lessons consumer, a usefulness consumer that rates the memory served during the work, and forecast history for routing; lessons and evidence are served back to agents' prompts, recall, forecasts and the passthru lessons instrument. Defaults change only when evidence shows a held-out win past the fishing margin and the promotion is filed under the role.edit gate, never by the run's author; every surface reads defaults through one resolver.">
<title>How Marina learns</title>
<desc>Learning loops: task verdicts, Code Mode checks and resolved forecasts each become one append-only outcomes row, while recurring patterns in agents' own work go straight to the lesson learner; durable deliveries feed a judged lessons consumer, a usefulness consumer that rates the memory served during the work, and forecast history for routing; lessons and evidence are served back to agents' prompts, recall, forecasts and the passthru lessons instrument. Defaults change only when evidence shows a held-out win past the fishing margin and the promotion is filed under the role.edit gate, never by the run's author; every surface reads defaults through one resolver.</desc>
