<text x="582" y="261" text-anchor="start" class="bs ink">rates the memory that was</text>
<text x="582" y="277.5" text-anchor="start" class="bs ink">served during the work</text>
<path d="M522,292 L534.0,292.0 Q544,292 544.0,282.0 L544.0,266.0 Q544,256 554.0,256.0 L568,256" fill="none" class="ls-memory" stroke-width="1.6" marker-end="url(#ah-memory)"/>
<rect x="568" y="304" width="286" height="72" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="582" y="326" text-anchor="start" class="t-neutral bt">history</text>
<text x="582" y="345" text-anchor="start" class="bs ink">forecasts only: formation</text>
<text x="582" y="361.5" text-anchor="start" class="bs ink">and score, for routing</text>
<path d="M522,292 L534.0,292.0 Q544,292 544.0,302.0 L544.0,330.0 Q544,340 554.0,340.0 L568,340" fill="none" class="ls-memory" stroke-width="1.6" marker-end="url(#ah-memory)"/>
<text x="552" y="392" text-anchor="start" class="muted bm">durable delivery per consumer</text>
<text x="552" y="410" text-anchor="start" class="muted bm">waits when over budget or a model</text>
<text x="552" y="428" text-anchor="start" class="muted bm">is down; never dropped</text>
