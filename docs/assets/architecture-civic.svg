<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 754" width="1180" height="754" role="img" aria-label="Civic substrate: work verified by another account earns standing in an append-only ledger with a 60-day half-life; standing gives a descriptive rank 0 to 4 and meets the floors of earnable gates. A gated command either runs (solo competence, operator grant or posture) or is held as a challenge that returns at once; a person answers, and a once-approval from outside the requester's lineage is a demonstration that eventually makes the gate solo. Six operator-grant gates have no floor, and audit, ledgers, receipts and trust labels are never off.">
<title>Trust: standing is earned, gates are proven</title>
<desc>Civic substrate: work verified by another account earns standing in an append-only ledger with a 60-day half-life; standing gives a descriptive rank 0 to 4 and meets the floors of earnable gates. A gated command either runs (solo competence, operator grant or posture) or is held as a challenge that returns at once; a person answers, and a once-approval from outside the requester's lineage is a demonstration that eventually makes the gate solo. Six operator-grant gates have no floor, and audit, ledgers, receipts and trust labels are never off.</desc>
