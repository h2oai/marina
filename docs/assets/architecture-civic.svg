<defs><marker id="ah-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-client"/></marker><marker id="ah-net" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-net"/></marker><marker id="ah-engine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-engine"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-agent"/></marker><marker id="ah-memory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-memory"/></marker><marker id="ah-civic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-civic"/></marker><marker id="ah-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-store"/></marker><marker id="ah-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-ext"/></marker><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-neutral"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah"/></marker></defs>
<rect class="bg" x="0" y="0" width="1180" height="754" rx="14"/>
<text class="ink h1" x="32" y="44">Trust: standing is earned, gates are proven</text>
<text class="muted h2" x="32" y="66">Standing comes only from work another account verified. Capability comes from safety gates, proven by approvals from people. Nothing waits on a person.</text>
<rect x="32" y="96" width="1116" height="48" rx="10" class="f-store s-store" stroke-width="1.2"/>
<text x="48" y="125" text-anchor="start" class="t-store bt">Operator switches — environment only</text>
<text x="400" y="125" text-anchor="start" class="mono t-store bm">MARINA_PROFILE  local · shared · public</text>
<text x="1132" y="125" text-anchor="end" class="mono t-store bm">MARINA_AUTONOMY  guarded · earned · open · sovereign</text>
<rect x="32" y="180" width="500" height="440" rx="14" class="s-memory" fill="none" stroke-width="1.4"/>
<rect x="48" y="169" width="161.04000000000002" height="22" rx="11" class="f-memory s-memory" stroke-width="1.2"/>
<text x="128.52" y="184" text-anchor="middle" class="t-memory gl">Earning standing</text>

<rect x="50" y="204" width="464" height="78" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="64" y="226" text-anchor="start" class="t-neutral bt">Work</text>
<text x="64" y="245" text-anchor="start" class="bs ink">a task, a Code Mode attempt, a forecast,</text>
<text x="64" y="261.5" text-anchor="start" class="bs ink">an experiment, help given</text>
<path d="M282,282 L282,308" fill="none" class="ls-memory" stroke-width="1.6" marker-end="url(#ah-memory)"/>
<rect x="50" y="308" width="464" height="78" rx="9" class="f-civic s-civic" stroke-width="1.3"/>
<text x="64" y="330" text-anchor="start" class="t-civic bt">Verified by another account</text>
<text x="64" y="349" text-anchor="start" class="bs ink">self-verification is refused; an agent in the</text>
<text x="64" y="365.5" text-anchor="start" class="bs ink">same lineage counts only when grounded</text>
<path d="M282,386 L282,412" fill="none" class="ls-memory" stroke-width="1.6" marker-end="url(#ah-memory)"/>
<rect x="50" y="412" width="464" height="78" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="64" y="434" text-anchor="start" class="t-neutral bt">Standing ledger</text>
<text x="64" y="453" text-anchor="start" class="bs ink">append-only · 60-day half-life · never negative</text>
<text x="64" y="469.5" text-anchor="start" class="mono bm t-neutral" opacity="0.9">src/agent/standing.ts</text>
<path d="M282,490 L282,516" fill="none" class="ls-memory" stroke-width="1.6" marker-end="url(#ah-memory)"/>
<rect x="50" y="516" width="464" height="78" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="64" y="538" text-anchor="start" class="t-neutral bt">Rank 0–4, descriptive</text>
<text x="64" y="557" text-anchor="start" class="bs ink">thresholds 5 · 15 · 40 · 100 — above 4,</text>
<text x="64" y="573.5" text-anchor="start" class="bs ink">standing never promotes; gates decide</text>
<rect x="572" y="180" width="576" height="440" rx="14" class="s-civic" fill="none" stroke-width="1.4"/>
<rect x="588" y="169" width="247.94000000000003" height="22" rx="11" class="f-civic s-civic" stroke-width="1.2"/>
<text x="711.97" y="184" text-anchor="middle" class="t-civic gl">Acting under a safety gate</text>

<rect x="590" y="204" width="540" height="58" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="604" y="226" text-anchor="start" class="t-neutral bt">A gated command arrives</text>
<text x="604" y="245" text-anchor="start" class="mono bm t-neutral" opacity="0.9">checkGateForExecution — one of 15 gates</text>
<rect x="590" y="292" width="262" height="90" rx="9" class="f-memory s-memory" stroke-width="1.3"/>
<text x="604" y="314" text-anchor="start" class="t-memory bt">Runs</text>
<text x="604" y="333" text-anchor="start" class="bs ink">solo competence earned,</text>
<text x="604" y="349.5" text-anchor="start" class="bs ink">or an operator grant,</text>
<text x="604" y="366" text-anchor="start" class="bs ink">or the posture lifts it</text>
<rect x="868" y="292" width="262" height="90" rx="9" class="f-civic s-civic" stroke-width="1.3"/>
<text x="882" y="314" text-anchor="start" class="t-civic bt">Held as a challenge</text>
<text x="882" y="333" text-anchor="start" class="bs ink">owner and operators get</text>
<text x="882" y="349.5" text-anchor="start" class="bs ink">a token; the agent's</text>
<text x="882" y="366" text-anchor="start" class="bs ink">turn goes on</text>
<path d="M721,262 L721,292" fill="none" class="ls-memory" stroke-width="1.6" marker-end="url(#ah-memory)"/>
<path d="M999,262 L999,292" fill="none" class="ls-civic" stroke-width="1.6" marker-end="url(#ah-civic)"/>
<rect x="868" y="412" width="262" height="90" rx="9" class="f-civic s-civic" stroke-width="1.3"/>
<text x="882" y="434" text-anchor="start" class="t-civic bt">A person answers</text>
<text x="882" y="453" text-anchor="start" class="bs ink">agents never approve;</text>
<text x="882" y="469.5" text-anchor="start" class="bs ink">once · always (operator)</text>
<text x="882" y="486" text-anchor="start" class="bs ink">· deny</text>
<path d="M999,382 L999,412" fill="none" class="ls-civic" stroke-width="1.6" marker-end="url(#ah-civic)"/>
<rect x="590" y="412" width="262" height="90" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="604" y="434" text-anchor="start" class="t-neutral bt">Demonstration</text>
<text x="604" y="453" text-anchor="start" class="bs ink">a once-approval from outside</text>
<text x="604" y="469.5" text-anchor="start" class="bs ink">the lineage counts; after 2–3,</text>
<text x="604" y="486" text-anchor="start" class="bs ink">the gate is solo</text>
<path d="M868,457 L852,457" fill="none" class="ls-civic" stroke-width="1.6" marker-end="url(#ah-civic)"/>
<path d="M721,412 L721,382" fill="none" class="ls-memory" stroke-width="1.6" marker-end="url(#ah-memory)"/>
<rect x="694.68" y="387" width="52.64" height="20" rx="10" class="pill"/>
<text x="721" y="401" text-anchor="middle" class=" al t-memory">builds</text>
<text x="590" y="528" text-anchor="start" class="t-civic al">Earnable gates — standing must meet the floor</text>
<rect x="590" y="536" width="93.89999999999999" height="24" rx="6" class="bg s-civic" stroke-width="1"/>
<text x="636.95" y="552" text-anchor="middle" class="mono bm t-civic">code.exec 3</text>
<rect x="689.9" y="536" width="114.6" height="24" rx="6" class="bg s-civic" stroke-width="1"/>
<text x="747.1999999999999" y="552" text-anchor="middle" class="mono bm t-civic">agent.spawn 10</text>
<rect x="810.5" y="536" width="100.8" height="24" rx="6" class="bg s-civic" stroke-width="1"/>
<text x="860.9" y="552" text-anchor="middle" class="mono bm t-civic">role.edit 10</text>
<rect x="917.3" y="536" width="128.39999999999998" height="24" rx="6" class="bg s-civic" stroke-width="1"/>
<text x="981.5" y="552" text-anchor="middle" class="mono bm t-civic">world.lineage 10</text>
<rect x="590" y="566" width="100.8" height="24" rx="6" class="bg s-civic" stroke-width="1"/>
<text x="640.4" y="582" text-anchor="middle" class="mono bm t-civic">agent.run 20</text>
<rect x="696.8" y="566" width="307.8" height="24" rx="6" class="bg s-civic" stroke-width="1"/>
<text x="850.6999999999999" y="582" text-anchor="middle" class="mono bm t-civic">decisions · adapter · connect · gateway 30</text>
<path d="M514,451 L552.0,451.0 Q562,451 562.0,461.0 L562.0,538.0 Q562,548 572.0,548.0 L590,548" fill="none" class="ls-memory" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah-memory)"/>
<rect x="32" y="650" width="548" height="76" rx="9" class="f-civic s-civic" stroke-width="1.3"/>
<text x="46" y="672" text-anchor="start" class="t-civic bt">Operator-grant gates (no floor, no demonstrations)</text>
<text x="46" y="691" text-anchor="start" class="mono bm t-civic" opacity="0.9">key.manage · admin.destructive · shell.exec</text>
<text x="46" y="707.5" text-anchor="start" class="mono bm t-civic" opacity="0.9">code.exec.unrestricted · world.code · trading.live</text>
<rect x="600" y="650" width="548" height="76" rx="9" class="f-store s-store" stroke-width="1.3"/>
<text x="614" y="672" text-anchor="start" class="t-store bt">Never off, in any profile</text>
<text x="614" y="691" text-anchor="start" class="bs ink">exec-decision audit · cognitive ledger · memory receipts</text>
<text x="614" y="707.5" text-anchor="start" class="bs ink">trusted / unverified labels · untrusted framing</text>
</svg>
