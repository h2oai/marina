<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 670" width="1180" height="670" role="img" aria-label="Command lifecycle: ingress, admission into the entity's FIFO queue, resolution, the as-of evidence fence, and authority (rank floor or safety gate). A held command becomes a challenge that returns at once and re-runs in the requester's slot when a person approves. An allowed command runs its handler, writes through the MarinaDB facade, emits one engine event that reaches dashboard stores, the feed and traces, and sends perceptions to people and agents.">
<title>The life of a command</title>
<desc>Command lifecycle: ingress, admission into the entity's FIFO queue, resolution, the as-of evidence fence, and authority (rank floor or safety gate). A held command becomes a challenge that returns at once and re-runs in the requester's slot when a person approves. An allowed command runs its handler, writes through the MarinaDB facade, emits one engine event that reaches dashboard stores, the feed and traces, and sends perceptions to people and agents.</desc>
<style>
text{font-family:Inter,"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.mono{font-family:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace}
.h1{font-size:22px;font-weight:700;letter-spacing:-0.2px}
.h2{font-size:13.5px;font-weight:500}
.bt{font-size:14px;font-weight:650}
.bs{font-size:12px}
.bm{font-size:11.5px}
.gl{font-size:11.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase}
.al{font-size:11.5px;font-weight:600}
.badge{font-size:12px;font-weight:700}
.bg{fill:#fbfcfd}.ink{fill:#1f2328}.muted{fill:#59636e}.line{stroke:#6e7781}.ah{fill:#6e7781}.pill{fill:#fbfcfd}.grid{stroke:#eaeef2}
.f-client{fill:#eef3ff}.s-client{stroke:#4c6ef5}.t-client{fill:#1e3a9a}.a-client{fill:#4c6ef5}.ls-client{stroke:#4c6ef5}.f-net{fill:#e7f6f3}.s-net{stroke:#139a86}.t-net{fill:#0b5e52}.a-net{fill:#139a86}.ls-net{stroke:#139a86}.f-engine{fill:#f1edff}.s-engine{stroke:#7048e8}.t-engine{fill:#46249f}.a-engine{fill:#7048e8}.ls-engine{stroke:#7048e8}.f-agent{fill:#fff4e0}.s-agent{stroke:#e08a00}.t-agent{fill:#7a4a00}.a-agent{fill:#e08a00}.ls-agent{stroke:#e08a00}.f-memory{fill:#e9f7ee}.s-memory{stroke:#2b9a4b}.t-memory{fill:#17602d}.a-memory{fill:#2b9a4b}.ls-memory{stroke:#2b9a4b}.f-civic{fill:#fff0f4}.s-civic{stroke:#d6336c}.t-civic{fill:#8f1a43}.a-civic{fill:#d6336c}.ls-civic{stroke:#d6336c}.f-store{fill:#f1f3f5}.s-store{stroke:#5c6773}.t-store{fill:#343a40}.a-store{fill:#5c6773}.ls-store{stroke:#5c6773}.f-ext{fill:#ffffff}.s-ext{stroke:#8c959f}.t-ext{fill:#3b434b}.a-ext{fill:#8c959f}.ls-ext{stroke:#8c959f}.f-neutral{fill:#ffffff}.s-neutral{stroke:#d0d7de}.t-neutral{fill:#1f2328}.a-neutral{fill:#d0d7de}.ls-neutral{stroke:#d0d7de}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.ink{fill:#e6edf3}.muted{fill:#9198a1}.line{stroke:#8b949e}.ah{fill:#8b949e}.pill{fill:#0d1117}.grid{stroke:#1c2128}
.f-client{fill:#141f3d}.s-client{stroke:#6f8cff}.t-client{fill:#b4c6ff}.a-client{fill:#6f8cff}.ls-client{stroke:#6f8cff}.f-net{fill:#0e2a27}.s-net{stroke:#2ec4ad}.t-net{fill:#8fe3d6}.a-net{fill:#2ec4ad}.ls-net{stroke:#2ec4ad}.f-engine{fill:#1e1838}.s-engine{stroke:#9b82ff}.t-engine{fill:#cdbfff}.a-engine{fill:#9b82ff}.ls-engine{stroke:#9b82ff}.f-agent{fill:#2b2010}.s-agent{stroke:#f2a93b}.t-agent{fill:#f8d596}.a-agent{fill:#f2a93b}.ls-agent{stroke:#f2a93b}.f-memory{fill:#0f2818}.s-memory{stroke:#45c46a}.t-memory{fill:#9de0b0}.a-memory{fill:#45c46a}.ls-memory{stroke:#45c46a}.f-civic{fill:#33141f}.s-civic{stroke:#f06595}.t-civic{fill:#f8b3cb}.a-civic{fill:#f06595}.ls-civic{stroke:#f06595}.f-store{fill:#1b2027}.s-store{stroke:#8b96a3}.t-store{fill:#d0d7de}.a-store{fill:#8b96a3}.ls-store{stroke:#8b96a3}.f-ext{fill:#161b22}.s-ext{stroke:#6e7781}.t-ext{fill:#c9d1d9}.a-ext{fill:#6e7781}.ls-ext{stroke:#6e7781}.f-neutral{fill:#161b22}.s-neutral{stroke:#3d444d}.t-neutral{fill:#e6edf3}.a-neutral{fill:#3d444d}.ls-neutral{stroke:#3d444d}
}</style>
<defs><marker id="ah-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-client"/></marker><marker id="ah-net" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-net"/></marker><marker id="ah-engine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-engine"/></marker><marker id="ah-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-agent"/></marker><marker id="ah-memory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-memory"/></marker><marker id="ah-civic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-civic"/></marker><marker id="ah-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-store"/></marker><marker id="ah-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-ext"/></marker><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="a-neutral"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0.8 L10,5 L0,9.2 z" class="ah"/></marker></defs>
<rect class="bg" x="0" y="0" width="1180" height="670" rx="14"/>
<text class="ink h1" x="32" y="44">The life of a command</text>
<text class="muted h2" x="32" y="66">Every action — a person typing, an agent's tool call, an MCP request, a schedule — takes this one path.</text>
<rect x="32" y="210" width="212" height="128" rx="9" class="f-net s-net" stroke-width="1.3"/>
<text x="72" y="232" text-anchor="start" class="t-net bt">Ingress</text>
<text x="46" y="251" text-anchor="start" class="bs ink">WebSocket · MCP · telnet</text>
<text x="46" y="267.5" text-anchor="start" class="bs ink">Discord · Telegram</text>
<text x="46" y="284" text-anchor="start" class="bs ink">dashboard · schedules</text>
<text x="46" y="300.5" text-anchor="start" class="mono bm t-net" opacity="0.9">dispatchCommand()</text>
<circle cx="54" cy="227" r="12" class="a-net"/><text x="54" y="231.3" text-anchor="middle" class="badge" fill="#ffffff">1</text>
<rect x="258" y="210" width="212" height="128" rx="9" class="f-engine s-engine" stroke-width="1.3"/>
<text x="298" y="232" text-anchor="start" class="t-engine bt">Admission</text>
<text x="272" y="251" text-anchor="start" class="bs ink">capacity check, then the</text>
<text x="272" y="267.5" text-anchor="start" class="bs ink">entity's own FIFO queue;</text>
<text x="272" y="284" text-anchor="start" class="bs ink">entities interleave</text>
<text x="272" y="300.5" text-anchor="start" class="mono bm t-engine" opacity="0.9">CommandCoordinator</text>
<circle cx="280" cy="227" r="12" class="a-engine"/><text x="280" y="231.3" text-anchor="middle" class="badge" fill="#ffffff">2</text>
<rect x="484" y="210" width="212" height="128" rx="9" class="f-engine s-engine" stroke-width="1.3"/>
<text x="524" y="232" text-anchor="start" class="t-engine bt">Resolve</text>
<text x="498" y="251" text-anchor="start" class="bs ink">modal rewrite · family</text>
<text x="498" y="267.5" text-anchor="start" class="bs ink">room command → builtin</text>
<text x="498" y="284" text-anchor="start" class="bs ink">→ macro (room·own·system)</text>
<text x="498" y="300.5" text-anchor="start" class="mono bm t-engine" opacity="0.9">CommandRouter</text>
<circle cx="506" cy="227" r="12" class="a-engine"/><text x="506" y="231.3" text-anchor="middle" class="badge" fill="#ffffff">3</text>
<rect x="710" y="210" width="212" height="128" rx="9" class="f-engine s-engine" stroke-width="1.3"/>
<text x="750" y="232" text-anchor="start" class="t-engine bt">As-of fence</text>
<text x="724" y="251" text-anchor="start" class="bs ink">under an evidence cutoff</text>
<text x="724" y="267.5" text-anchor="start" class="bs ink">only fenced or allowed</text>
<text x="724" y="284" text-anchor="start" class="bs ink">commands run</text>
<text x="724" y="300.5" text-anchor="start" class="mono bm t-engine" opacity="0.9">evidence-fence.ts</text>
<circle cx="732" cy="227" r="12" class="a-engine"/><text x="732" y="231.3" text-anchor="middle" class="badge" fill="#ffffff">4</text>
<rect x="936" y="210" width="212" height="128" rx="9" class="f-civic s-civic" stroke-width="1.3"/>
<text x="976" y="232" text-anchor="start" class="t-civic bt">Authority</text>
<text x="950" y="251" text-anchor="start" class="bs ink">rank floor, or the</text>
<text x="950" y="267.5" text-anchor="start" class="bs ink">command's safety gate</text>
<text x="950" y="284" text-anchor="start" class="bs ink">(the gate decides alone)</text>
<text x="950" y="300.5" text-anchor="start" class="mono bm t-civic" opacity="0.9">checkGateForExecution</text>
<circle cx="958" cy="227" r="12" class="a-civic"/><text x="958" y="231.3" text-anchor="middle" class="badge" fill="#ffffff">5</text>
<path d="M244,274 L258,274" fill="none" class="ls-engine" stroke-width="1.6" marker-end="url(#ah-engine)"/>
<path d="M470,274 L484,274" fill="none" class="ls-engine" stroke-width="1.6" marker-end="url(#ah-engine)"/>
<path d="M696,274 L710,274" fill="none" class="ls-engine" stroke-width="1.6" marker-end="url(#ah-engine)"/>
<path d="M922,274 L936,274" fill="none" class="ls-engine" stroke-width="1.6" marker-end="url(#ah-engine)"/>
<rect x="404" y="92" width="492" height="76" rx="9" class="f-civic s-civic" stroke-width="1.3"/>
<text x="418" y="114" text-anchor="start" class="t-civic bt">Challenge — held, never blocked</text>
<text x="418" y="133" text-anchor="start" class="bs ink">a token goes to the owner and operators; the command returns at once</text>
<text x="418" y="149.5" text-anchor="start" class="bs ink">a person approves once, or always (an operator grant), or denies</text>
<path d="M1042,210 L1042.0,140.0 Q1042,130 1032.0,130.0 L896,130" fill="none" class="ls-civic" stroke-width="1.6" marker-end="url(#ah-civic)"/>
<rect x="1022.12" y="178" width="39.760000000000005" height="20" rx="10" class="pill"/>
<text x="1042" y="192" text-anchor="middle" class=" al t-civic">held</text>
<path d="M404,130 L374.0,130.0 Q364,130 364.0,140.0 L364,210" fill="none" class="ls-civic" stroke-width="1.6" marker-end="url(#ah-civic)"/>
<rect x="181.76" y="178" width="284.48" height="20" rx="10" class="pill"/>
<text x="324" y="192" text-anchor="middle" class=" al t-civic">approved → re-runs in the requester's slot</text>
<rect x="936" y="402" width="212" height="112" rx="9" class="f-engine s-engine" stroke-width="1.3"/>
<text x="976" y="424" text-anchor="start" class="t-engine bt">Handler</text>
<text x="950" y="443" text-anchor="start" class="bs ink">runs with CommandContext</text>
<text x="950" y="459.5" text-anchor="start" class="bs ink">150 ms command-phase budget</text>
<text x="950" y="476" text-anchor="start" class="bs ink">reply, or refuseCommand</text>
<text x="950" y="492.5" text-anchor="start" class="bs ink">→ usage records a failure</text>
<circle cx="958" cy="419" r="12" class="a-engine"/><text x="958" y="423.3" text-anchor="middle" class="badge" fill="#ffffff">6</text>
<rect x="710" y="402" width="212" height="112" rx="9" class="f-store s-store" stroke-width="1.3"/>
<text x="750" y="424" text-anchor="start" class="t-store bt">Write</text>
<text x="724" y="443" text-anchor="start" class="bs ink">MarinaDB facade → db-*.ts</text>
<text x="724" y="459.5" text-anchor="start" class="bs ink">store module → SQLite;</text>
<text x="724" y="476" text-anchor="start" class="bs ink">multi-row writes atomic</text>
<text x="724" y="492.5" text-anchor="start" class="mono bm t-store" opacity="0.9">src/persistence/</text>
<circle cx="732" cy="419" r="12" class="a-store"/><text x="732" y="423.3" text-anchor="middle" class="badge" fill="#ffffff">7</text>
<rect x="484" y="402" width="212" height="112" rx="9" class="f-engine s-engine" stroke-width="1.3"/>
<text x="524" y="424" text-anchor="start" class="t-engine bt">Event</text>
<text x="498" y="443" text-anchor="start" class="bs ink">one EngineEvent per</text>
<text x="498" y="459.5" text-anchor="start" class="bs ink">mutation, at the</text>
<text x="498" y="476" text-anchor="start" class="bs ink">write site</text>
<text x="498" y="492.5" text-anchor="start" class="mono bm t-engine" opacity="0.9">EventLog</text>
<circle cx="506" cy="419" r="12" class="a-engine"/><text x="506" y="423.3" text-anchor="middle" class="badge" fill="#ffffff">8</text>
<path d="M1042,338 L1042,402" fill="none" class="ls-civic" stroke-width="1.6" marker-end="url(#ah-civic)"/>
<rect x="1012.46" y="360" width="59.080000000000005" height="20" rx="10" class="pill"/>
<text x="1042" y="374" text-anchor="middle" class=" al t-civic">allowed</text>
<path d="M936,458 L922,458" fill="none" class="ls-engine" stroke-width="1.6" marker-end="url(#ah-engine)"/>
<path d="M710,458 L696,458" fill="none" class="ls-engine" stroke-width="1.6" marker-end="url(#ah-engine)"/>
<rect x="72" y="396" width="372" height="38" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="88" y="420" text-anchor="start" class="ink bt">Dashboard stores</text>
<text x="432" y="420" text-anchor="end" class="muted bs">live updates over WebSocket</text>
<path d="M484,458 L474.0,458.0 Q464,458 464.0,448.0 L464.0,425.0 Q464,415 454.0,415.0 L444,415" fill="none" class="ls-engine" stroke-width="1.6" marker-end="url(#ah-engine)"/>
<rect x="72" y="440" width="372" height="38" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="88" y="464" text-anchor="start" class="ink bt">Feed timeline</text>
<text x="432" y="464" text-anchor="end" class="mono muted bm">feed_events</text>
<path d="M484,458 L464.5,458.0 Q464,458 464.0,458.5 L464.0,458.5 Q464,459 463.5,459.0 L444,459" fill="none" class="ls-engine" stroke-width="1.6" marker-end="url(#ah-engine)"/>
<rect x="72" y="484" width="372" height="38" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="88" y="508" text-anchor="start" class="ink bt">Traces &amp; listeners</text>
<text x="432" y="508" text-anchor="end" class="muted bs">spans · standing credits</text>
<path d="M484,458 L474.0,458.0 Q464,458 464.0,468.0 L464.0,493.0 Q464,503 454.0,503.0 L444,503" fill="none" class="ls-engine" stroke-width="1.6" marker-end="url(#ah-engine)"/>
<rect x="710" y="562" width="438" height="80" rx="9" class="f-agent s-agent" stroke-width="1.3"/>
<text x="724" y="584" text-anchor="start" class="t-agent bt">Perceptions</text>
<text x="724" y="603" text-anchor="start" class="bs ink">the reply, room broadcasts and tells reach people and agents;</text>
<text x="724" y="619.5" text-anchor="start" class="bs ink">for an agent, attention decides what wakes it</text>
<path d="M1042,514 L1042,562" fill="none" class="ls-agent" stroke-width="1.6" marker-end="url(#ah-agent)"/>
<rect x="1009.24" y="528" width="65.52000000000001" height="20" rx="10" class="pill"/>
<text x="1042" y="542" text-anchor="middle" class=" al t-agent">messages</text>
<rect x="32" y="562" width="664" height="80" rx="9" class="f-neutral s-neutral" stroke-width="1.3"/>
<text x="46" y="584" text-anchor="start" class="t-neutral bt">Guarantees</text>
<text x="46" y="603" text-anchor="start" class="bs ink">one entity runs strictly in order; different entities interleave</text>
<text x="46" y="619.5" text-anchor="start" class="bs ink">a macro or batch runs inline in its own slot · no handler waits on a person</text>
</svg>
