# Prophet Arena agent manifest (read by `prophet submit` / `prophet run`).
# No identity ships: replace the placeholders with YOUR entrant before registering
# (or set PROPHET_AGENT_NAME / PROPHET_AGENT_DISPLAY_NAME, which the agent prefers).
# The agent refuses to load while the name is still a placeholder.
[agent]
name = "your-entrant"
display_name = "Your Org Marina"
# Marina researches on its own; the track is immutable once registered.
track = "agentic"
description = "Built on Marina: open-source multi-model forecasting with research, verification and lessons."

# Self-declared design metadata, shown on the agent's public page.
[card]
methodology = "plan -> date-bounded research -> independent runs -> formation (ensemble/delphi/tournament) -> verification and critique"
tools = ["web research", "market and official-series lookups"]
