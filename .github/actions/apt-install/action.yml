name: Install apt packages (cached, bounded)
description: >
  apt-get install with the downloaded .debs cached between runs, no recommended
  extras, and each attempt bounded so a crawling mirror cannot eat the job's
  whole timeout. A slow first attempt retries against archive.ubuntu.com.
inputs:
  packages:
    description: Space-separated package names
    required: true
  attempt-seconds:
    description: Time limit for one update + install attempt
    default: "240"
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        echo "dir=$RUNNER_TEMP/apt-archives" >> "$GITHUB_OUTPUT"
        echo "hash=$(echo "$ImageOS-$ImageVersion-$PACKAGES" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: apt-${{ runner.os }}-${{ steps.key.outputs.hash }}
        restore-keys: apt-${{ runner.os }}-
    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        ARCHIVES: ${{ steps.key.outputs.dir }}
        ATTEMPT_SECONDS: ${{ inputs.attempt-seconds }}
      run: |
        mkdir -p "$ARCHIVES/partial"
        opts=(-o "Dir::Cache::Archives=$ARCHIVES" -o APT::Sandbox::User=root
              -o Acquire::Retries=3 -o Acquire::http::Timeout=30)
        attempt() {
          sudo timeout "$ATTEMPT_SECONDS" apt-get "${opts[@]}" update -q &&
            sudo timeout "$ATTEMPT_SECONDS" env DEBIAN_FRONTEND=noninteractive \
              apt-get "${opts[@]}" install -y -q --no-install-recommends $PACKAGES
        }
        if ! attempt; then
          echo "::warning::apt attempt 1 failed or timed out; retrying against archive.ubuntu.com"
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          attempt
        fi
        # Leave only finished .debs, readable by the cache step.
        sudo rm -rf "$ARCHIVES/partial" "$ARCHIVES/lock"
        sudo chown -R "$(id -u):$(id -g)" "$ARCHIVES"
