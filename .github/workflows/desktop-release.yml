name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      env:
        description: "Build environment"
        required: true
        default: "canary"
        type: choice
        options:
          - canary
          - stable

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/desktop-v')
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: windows-latest
            platform: win-x64
          - runner: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Sync Electrobun SDK
        working-directory: marina-desktop
        run: bun run sync
      - name: Validate desktop
        working-directory: marina-desktop
        run: |
          bun run typecheck
          bun run test
      - name: Build native release
        working-directory: marina-desktop
        env:
          BUILD_ENV: ${{ github.event.inputs.env || 'stable' }}
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: bun run "build:$BUILD_ENV"
      - uses: ./.github/actions/setup-syft
      - name: Inventory build inputs
        run: bun run sbom marina-desktop/build/source-${{ matrix.platform }}.cdx.json
      # Sign every v2 payload and channel metadata file, before adding evidence.
      - uses: ./.github/actions/attest-release
        id: attest
        with:
          subject-path: marina-desktop/artifacts/*
          sbom-path: marina-desktop/build/source-${{ matrix.platform }}.cdx.json
      - name: Preserve verification bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.attest.outputs.provenance-bundle }}
          SBOM_BUNDLE: ${{ steps.attest.outputs.sbom-bundle }}
          ARTIFACT_PLATFORM: ${{ matrix.platform }}
        run: |
          cp "marina-desktop/build/source-$ARTIFACT_PLATFORM.cdx.json" marina-desktop/artifacts/
          cp "$PROVENANCE_BUNDLE" "marina-desktop/artifacts/provenance-$ARTIFACT_PLATFORM.sigstore.json"
          cp "$SBOM_BUNDLE" "marina-desktop/artifacts/sbom-$ARTIFACT_PLATFORM.sigstore.json"
      - name: Upload all release payloads without renaming
        uses: actions/upload-artifact@v7.0.1
        with:
          name: marina-${{ matrix.platform }}
          path: marina-desktop/artifacts/*
          if-no-files-found: error

  release:
    permissions:
      contents: write
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: true
