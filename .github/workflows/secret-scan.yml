name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - name: Run gitleaks over the full history
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          # Scan every ancestor of this revision, including the PR merge parents.
          # Gitleaks defaults to --all, which also scans unrelated remote branches
          # fetched by checkout's fetch-depth: 0 and makes their findings fail this PR.
          "$(go env GOPATH)/bin/gitleaks" git --no-banner --redact --log-opts=HEAD .
