name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned release, checksum verified)
        # The release binary, not `go install`: compiling gitleaks took about
        # six of the job's seven minutes on every PR and merge-queue run,
        # while the scan itself takes about ten seconds.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Run gitleaks over the full history
        run: |
          # Scan every ancestor of this revision, including the PR merge parents.
          # Gitleaks defaults to --all, which also scans unrelated remote branches
          # fetched by checkout's fetch-depth: 0 and makes their findings fail this PR.
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts=HEAD .
