name: Deploy site

# Builds the Astro + Starlight site in /site and publishes it to GitHub Pages.
# The public repository is a GitHub Pages project site served under /marina/.
# Override SITE_BASE only if the site moves to a custom domain.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "bun.lock"
      - "package.json"
      - ".bun-version"
      - "docs/guides/**"
      - "docs/reference/api.json"
      - ".github/workflows/site-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        # The site is a Bun workspace member; its deps live in the root bun.lock.
        run: bun install --frozen-lockfile
      - name: Build site
        run: cd site && bun run build
        env:
          SITE_BASE: /marina
          SITE_URL: https://h2oai.github.io
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
