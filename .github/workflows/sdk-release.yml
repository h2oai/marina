name: SDK Release

# Prepared but OFF. It runs only by hand (Actions → SDK Release → Run workflow). Every run builds
# and tests the four SDK packages and uploads them as an artifact. Publishing happens only when
# BOTH the run's `publish` input is checked AND the repository variable MARINA_SDK_PUBLISH is
# `on`, and then only to registries whose credentials exist. Nothing here runs on push, tag or PR.
#
# Before turning publishing on, set up (Settings → Secrets and variables → Actions):
#   NPM_TOKEN             npm automation token for @marina/agent-sdk
#   PYPI_TOKEN            PyPI API token for marina-sdk
#   CARGO_REGISTRY_TOKEN  crates.io token for marina-sdk
#   Maven Central (ai.h2o:marina-sdk) needs a Sonatype account, a verified namespace and a
#   signing key; its step (run only when MARINA_MAVEN_PUBLISH is `on`) fails on purpose until
#   that publishing is written.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the registries (also needs the MARINA_SDK_PUBLISH variable set to on)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.node-version
          package-manager-cache: false
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Test every SDK against a live server
        run: bun test test/sdk-conformance.test.ts test/sdk-front-door.test.ts test/python-sdk.test.ts test/java-sdk.test.ts test/rust-sdk.test.ts
      - name: Build the packages
        run: bun run scripts/package-sdks.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marina-sdks
          path: dist/sdks/
          if-no-files-found: error

  publish:
    needs: package
    if: inputs.publish && vars.MARINA_SDK_PUBLISH == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: sdk-release
    # Job-level, so each step's `if` can see whether its registry has credentials.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.node-version
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build the packages
        run: bun run scripts/package-sdks.ts
      - name: npm (@marina/agent-sdk)
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish dist/sdks/typescript/*.tgz --access public
      - name: PyPI (marina-sdk)
        if: env.TWINE_PASSWORD != ''
        run: |
          python3 -m pip install --user "twine==6.*"
          python3 -m twine upload dist/sdks/python/*.whl
      - name: crates.io (marina-sdk)
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --manifest-path sdks/rust/Cargo.toml
      - name: Maven Central (ai.h2o:marina-sdk)
        if: vars.MARINA_MAVEN_PUBLISH == 'on'
        run: |
          echo "Maven Central publishing is not configured yet: it needs a Sonatype account, a"
          echo "verified ai.h2o namespace and a signing key. The jar is in the marina-sdks artifact."
          exit 1
