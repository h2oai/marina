name: Supply Chain
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # An advisory can be published against a dependency we already ship, with no
  # commit to trigger anything. Without a clock the audit below only runs when
  # someone opens a pull request, so the first symptom is a blocked deploy.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # qualify:release ends in `bun audit`, so an advisory against a dependency we
  # already ship fails every deploy while every pull request stays green — the
  # failure surfaces far from the change that could address it. Audit here too,
  # so it fails the pull request instead, and on a schedule so an advisory
  # published between pull requests is not discovered by a blocked deploy.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Audit dependencies for published advisories
        run: bun audit

  build:
    # The scheduled run exists for the audit; rebuilding and re-uploading a
    # 90-day package artifact daily would add nothing.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: ./.github/actions/setup-syft
      - run: bun install --frozen-lockfile
      - name: Generate and check complete repository inventory
        run: bun run sbom
      - name: Build the distributable package
        run: |
          bun run dashboard:build
          bun run build:memory
          bun pm pack --ignore-scripts --filename dist/supply-chain/marina.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marina-package-${{ github.sha }}
          path: dist/supply-chain/
          if-no-files-found: error
          retention-days: 90

  attest:
    needs: build
    # No OIDC/signing authority is granted to a job executing pull-request code.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: marina-package-${{ github.sha }}
          path: dist/supply-chain/
      - name: Sign package build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/supply-chain/marina.tgz
      - name: Bind the build-input inventory to the package digest
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/supply-chain/marina.tgz
          sbom-path: dist/supply-chain/source.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: marina-attestations-${{ github.sha }}
          path: |
            ${{ steps.provenance.outputs.bundle-path }}
            ${{ steps.sbom.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90
