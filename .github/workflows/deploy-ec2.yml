name: Deploy to EC2
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Rollback: full SHA of an already-built image whose main-branch CI passed. Leave empty to deploy the current, CI-qualified main commit."
        required: false
        type: string
        default: ""

concurrency:
  group: h2o-marina-ec2-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  ECR_ACCOUNT_ID: ${{ vars.ECR_ACCOUNT_ID }}
  ECR_REPOSITORY: "h2oai-marina"

jobs:
  qualify:
    # workflow_run also fires for failed/cancelled CI and for PR runs. Neither
    # may reach checkout, AWS credentials, or production.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      rollback: ${{ steps.target.outputs.rollback }}
    steps:
      - name: Resolve a CI-qualified revision
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          set -euo pipefail
          rollback=false
          case "$EVENT_NAME" in
            workflow_run) sha="$CI_SHA" ;;
            workflow_dispatch)
              [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::Manual deployments must run from main"; exit 1; }
              sha="${ROLLBACK_SHA:-$GITHUB_SHA}"
              if [ -n "${ROLLBACK_SHA:-}" ]; then rollback=true; fi
              ;;
            *) echo "::error::Unsupported deployment event"; exit 1 ;;
          esac
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Expected a full commit SHA"; exit 1; }

          # Check the most recent CI run for THIS revision, including manual
          # deploys and rollbacks. An older success cannot mask a failed rerun.
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&branch=main&event=push&per_page=100" \
            --jq '.workflow_runs | sort_by(.run_number, .run_attempt) | last')
          jq -e --arg sha "$sha" --arg repo "$GITHUB_REPOSITORY" '
            .head_sha == $sha and .head_branch == "main" and .event == "push" and
            .head_repository.full_name == $repo and .path == ".github/workflows/ci.yml" and
            .status == "completed" and .conclusion == "success"
          ' <<< "$run" >/dev/null || { echo "::error::Target revision has no current successful main-branch CI run"; exit 1; }

          if [ "$rollback" = false ]; then
            latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [ "$sha" != "$latest" ]; then
              echo "Skipping superseded revision $sha; main is now $latest"
              exit 0
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "rollback=$rollback" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        if: steps.target.outputs.sha != ''
        with:
          ref: ${{ steps.target.outputs.sha }}
      - uses: oven-sh/setup-bun@v2.2.0
        if: steps.target.outputs.sha != ''
        with:
          bun-version-file: .bun-version
      - name: Install exact-revision dependencies
        if: steps.target.outputs.sha != ''
        run: bun install --frozen-lockfile
      - name: Install qualification browser
        if: steps.target.outputs.sha != ''
        working-directory: dashboard
        run: |
          bunx playwright install --with-deps chromium
          bun -e 'import { chromium } from "@playwright/test"; console.log("PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Qualify release from selected revision before deployment credentials
        if: steps.target.outputs.sha != ''
        run: bun run qualify:release
      - name: Build selected revision image for qualification
        if: steps.target.outputs.sha != ''
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: docker build --label "org.opencontainers.image.revision=$TARGET_SHA" -t marina-qualification .
      - name: Qualify packaged image
        if: steps.target.outputs.sha != ''
        run: bun run qualify:image marina-qualification
      - name: Reject fixable high and critical image vulnerabilities
        if: steps.target.outputs.sha != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: marina-qualification
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

      - name: Preserve the qualified image and its identity
        if: steps.target.outputs.sha != '' && steps.target.outputs.rollback != 'true'
        run: |
          docker image inspect --format '{{.Id}}' marina-qualification > qualified-image.id
          docker save --output qualified-image.tar marina-qualification
      - uses: actions/upload-artifact@v7.0.1
        if: steps.target.outputs.sha != '' && steps.target.outputs.rollback != 'true'
        with:
          name: qualified-image-${{ steps.target.outputs.sha }}
          path: |
            qualified-image.tar
            qualified-image.id
          compression-level: 1
          retention-days: 7

  deploy:
    needs: qualify
    if: needs.qualify.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.qualify.outputs.sha }}

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@v8.0.1
        if: needs.qualify.outputs.rollback != 'true'
        with:
          name: qualified-image-${{ needs.qualify.outputs.sha }}
      - name: Load the exact qualified image
        if: needs.qualify.outputs.rollback != 'true'
        run: |
          set -euo pipefail
          docker load --input qualified-image.tar
          test "$(docker image inspect --format '{{.Id}}' marina-qualification)" = "$(cat qualified-image.id)"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ secrets.GH_OIDC_ROLE_H2O_MARINA }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve deploy target (build vs rollback)
        id: target
        env:
          TARGET_SHA: ${{ needs.qualify.outputs.sha }}
          ROLLBACK: ${{ needs.qualify.outputs.rollback }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          if [ "$ROLLBACK" = true ]; then
            echo "Rollback requested → redeploying sha-${TARGET_SHA} (build/push skipped)"
            # Fail fast if that image isn't already in ECR.
            aws ecr describe-images --region "$REGION" \
              --registry-id "$ECR_ACCOUNT_ID" --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="sha-${TARGET_SHA}" >/dev/null \
              || { echo "::error::No image tagged sha-${TARGET_SHA} in ${ECR_REPOSITORY}"; exit 1; }
            echo "sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
            echo "rollback=true" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
            echo "rollback=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate required configuration
        env:
          INSTANCE_ID: ${{ vars.MARINA_INSTANCE_ID }}
          APP_DIR: ${{ vars.MARINA_APP_DIR }}
          TARGET_SHA: ${{ needs.qualify.outputs.sha }}
        run: |
          set -euo pipefail
          : "${INSTANCE_ID:?Set repo variable MARINA_INSTANCE_ID}"
          : "${APP_DIR:?Set repo variable MARINA_APP_DIR}"
          echo "Deploying commit ${TARGET_SHA} to ${INSTANCE_ID}:${APP_DIR}"

      - name: Log in to Amazon ECR (cross-account registry)
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.7
        with:
          registries: ${{ env.ECR_ACCOUNT_ID }}

      - name: Pull the existing rollback artifact
        if: steps.target.outputs.rollback == 'true'
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${{ steps.target.outputs.sha }}
        run: |
          docker pull "$IMAGE"
          docker tag "$IMAGE" marina-qualification
      - name: Qualify the actual rollback artifact
        if: steps.target.outputs.rollback == 'true'
        run: bun run qualify:image marina-qualification
      - name: Scan the actual rollback artifact
        if: steps.target.outputs.rollback == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: marina-qualification
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
      - name: Push the qualified image without rebuilding
        if: steps.target.outputs.rollback != 'true'
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          docker tag marina-qualification "$IMAGE:sha-$TARGET_SHA"
          docker push "$IMAGE:sha-$TARGET_SHA"
          docker tag marina-qualification "$IMAGE:latest"
          docker push "$IMAGE:latest"
      - name: Record the immutable deployed artifact
        id: image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          [[ "$digest" == *@sha256:* ]] || { echo "::error::Missing image digest"; exit 1; }
          echo "ref=$digest" >> "$GITHUB_OUTPUT"
          echo "Qualified deployment artifact: $digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Recheck main before changing production
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.qualify.outputs.sha }}
          ROLLBACK: ${{ needs.qualify.outputs.rollback }}
        run: |
          set -euo pipefail
          if [ "$ROLLBACK" != true ]; then
            latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [ "$TARGET_SHA" != "$latest" ]; then
              echo "Skipping superseded build $TARGET_SHA; main is now $latest"
              exit 0
            fi
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy via SSM Run Command
        if: steps.current.outputs.deploy == 'true'
        id: send
        env:
          INSTANCE_ID: ${{ vars.MARINA_INSTANCE_ID }}
          APP_DIR: ${{ vars.MARINA_APP_DIR }}
          REGION: ${{ vars.AWS_REGION }}
          IMAGE: ${{ steps.image.outputs.ref }}
          GIT_REF: ${{ steps.target.outputs.sha }}
          REF_NAME: main
        run: |
          set -euo pipefail
          # Build the command list safely (no shell-injection of dir/ref/image).
          jq -n \
            --arg dir "$APP_DIR" \
            --arg ref "$GIT_REF" \
            --arg refname "$REF_NAME" \
            --arg img "$IMAGE" \
            --arg region "$REGION" '{
            commands: [
              "set -euo pipefail",
              "export HOME=/root",
              "export AWS_REGION=\($region|@sh)",
              "export MARINA_IMAGE=\($img|@sh)",
              "cd \($dir|@sh)",
              "git config --global --add safe.directory \($dir|@sh)",
              "git fetch origin \($refname|@sh) --prune",
              "git reset --hard \($ref|@sh)",
              "bash scripts/deploy.sh"
            ]
          }' > /tmp/ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Marina ${GIT_REF:0:7} (run ${GITHUB_RUN_ID})" \
            --parameters file:///tmp/ssm-params.json \
            --query 'Command.CommandId' --output text)
          echo "SSM CommandId: $CMD_ID"
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to finish
        if: steps.current.outputs.deploy == 'true'
        env:
          INSTANCE_ID: ${{ vars.MARINA_INSTANCE_ID }}
          CMD_ID: ${{ steps.send.outputs.cmd_id }}
        run: |
          set -euo pipefail
          STATUS="Pending"
          # Poll up to ~30 min.
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 15
          done

          echo "::group::Deploy stdout"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text || true
          echo "::endgroup::"
          echo "::group::Deploy stderr"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text || true
          echo "::endgroup::"

          echo "Final SSM status: $STATUS"
          [ "$STATUS" = "Success" ]
