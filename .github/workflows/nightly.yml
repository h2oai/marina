# Nightly qualification on main. Deliberately NOT triggered by pull_request so
# it never becomes a required PR check: the browser suite needs a real Chromium
# and a disposable Marina server, and the release qualifier runs the whole
# repo (backend + dashboard + site + audit) — both too slow for the PR loop.
name: Nightly

on:
  schedule:
    # 04:17 UTC daily — off the hour to avoid the GitHub cron rush.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Dashboard browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium for Playwright
        working-directory: dashboard
        run: bunx playwright install --with-deps chromium
      - name: Point playwright.config at the installed Chromium
        # playwright.config.ts defaults to /usr/bin/chromium (a distro install);
        # on the runner the browser lives in Playwright's cache instead.
        run: |
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -n 1)"
          test -n "$CHROME" || { echo "chromium not found under ~/.cache/ms-playwright"; exit 1; }
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Build dashboard bundle
        # The e2e server boots src/main.ts, which serves dist/dashboard.
        run: bun run dashboard:build
      - name: Browser tests
        working-directory: dashboard
        env:
          MARINA_BROWSER_ARTIFACTS: ${{ github.workspace }}/browser-results
        run: bun run test:browser
      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-results
          path: browser-results
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: Backend coverage (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking by design: the soft floor in bunfig.toml exists to surface a
    # large regression, never to gate a merge. The PR CI sharded matrix is
    # untouched — coverage runs the suite unsharded and is far too slow for it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test with coverage
        run: bun run test:coverage
      - name: Per-directory coverage report
        # `--strict` so the floor in scripts/check-coverage.ts actually means
        # something: the STEP goes red below it. The job keeps
        # continue-on-error above, so coverage still never blocks a merge —
        # it is a visible signal, not a gate. Without --strict the floor would
        # enforce nothing at all.
        run: bun run check:coverage -- --strict
      - name: Upload lcov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  release-qualifier:
    name: Release qualifier (qualify:release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        # One workspace install covers dashboard + site for qualify:release.
        run: bun install --frozen-lockfile
      - name: Check workspace versions
        run: bun run check:versions
      - name: Audit dependency overrides
        # Report-only: prints the table (still needed / no longer needed /
        # unknown, plus documented security note) without blocking the run.
        # Run `bun run check:overrides --strict` locally to gate on it.
        continue-on-error: true
        run: bun run check:overrides
      - name: Install Chromium for Playwright
        # qualify:release includes `dashboard test:browser`.
        working-directory: dashboard
        run: bunx playwright install --with-deps chromium
      - name: Point playwright.config at the installed Chromium
        run: |
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -n 1)"
          test -n "$CHROME" || { echo "chromium not found under ~/.cache/ms-playwright"; exit 1; }
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Qualify release
        continue-on-error: false
        run: bun run qualify:release
