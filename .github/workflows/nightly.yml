# Nightly qualification on main: the full dashboard Playwright suite, a backend
# coverage report and the release qualifier (backend + dashboard + site +
# audit). Deliberately NOT triggered by pull_request, so none of it becomes a
# required PR check; PR CI runs the shorter participation browser journeys.
name: Nightly

on:
  schedule:
    # 04:17 UTC daily — off the hour to avoid the GitHub cron rush.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Dashboard browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      # Dashboard tests run on Node; pin the version CI uses (dashboard/.node-version).
      - name: Set up dashboard test runtime
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: dashboard/.node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium's system libraries
        # Chromium's own libraries from `playwright install --with-deps` on
        # ubuntu-24.04 (headless: no X server or extra fonts), through the cached,
        # bounded apt action, so a crawling mirror fails fast instead of timing out.
        timeout-minutes: 9
        uses: ./.github/actions/apt-install
        with:
          attempt-seconds: "240"
          packages: >-
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2
            libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3
            libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3
            libxkbcommon0 libxrandr2 fonts-liberation
      - name: Install Chromium for Playwright
        working-directory: dashboard
        # The browser itself comes from the Playwright CDN: each try is bounded.
        run: |
          for attempt in 1 2 3; do
            timeout 180 bunx playwright install chromium && exit 0
            echo "::warning::playwright browser download failed or timed out (attempt $attempt of 3)"
            sleep $((attempt * 10))
          done
          exit 1
      - name: Point playwright.config at the installed Chromium
        # playwright.config.ts defaults to /usr/bin/chromium (a distro install);
        # on the runner the browser lives in Playwright's cache instead.
        run: |
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -n 1)"
          test -n "$CHROME" || { echo "chromium not found under ~/.cache/ms-playwright"; exit 1; }
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Build dashboard bundle
        # The e2e server boots src/main.ts, which serves dist/dashboard.
        run: bun run dashboard:build
      - name: Browser tests
        working-directory: dashboard
        env:
          MARINA_BROWSER_ARTIFACTS: ${{ github.workspace }}/browser-results
        run: bun run test:browser
      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dashboard-browser-results
          path: browser-results
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: Backend coverage (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Non-blocking by design: the floor in scripts/check-coverage.ts surfaces a
    # large regression, never gates a merge. The PR CI sharded matrix is
    # untouched — coverage runs the suite unsharded and is far too slow for it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test with coverage
        run: bun run test:coverage
      - name: Per-directory coverage report
        # `--strict` so the floor in scripts/check-coverage.ts actually means
        # something: the STEP goes red below it. The job keeps
        # continue-on-error above, so coverage still never blocks a merge —
        # it is a visible signal, not a gate. Without --strict the floor would
        # enforce nothing at all.
        run: bun run check:coverage -- --strict
      - name: Upload lcov report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: backend-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  release-qualifier:
    name: Release qualifier (qualify:release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      # Dashboard tests run on Node; pin the version CI uses (dashboard/.node-version).
      - name: Set up dashboard test runtime
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: dashboard/.node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        # One workspace install covers dashboard + site for qualify:release.
        run: bun install --frozen-lockfile
      - name: Check workspace versions
        run: bun run check:versions
      - name: Audit dependency overrides
        # Report-only: prints the table (still needed / no longer needed /
        # unknown, plus documented security note) without blocking the run.
        # Run `bun run check:overrides --strict` locally to gate on it.
        continue-on-error: true
        run: bun run check:overrides
      - name: Install Chromium's system libraries
        # Chromium's own libraries from `playwright install --with-deps` on
        # ubuntu-24.04 (headless: no X server or extra fonts), through the cached,
        # bounded apt action, so a crawling mirror fails fast instead of timing out.
        timeout-minutes: 9
        uses: ./.github/actions/apt-install
        with:
          attempt-seconds: "240"
          packages: >-
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2
            libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3
            libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3
            libxkbcommon0 libxrandr2 fonts-liberation
      - name: Install Chromium for Playwright
        working-directory: dashboard
        # The browser itself comes from the Playwright CDN: each try is bounded.
        run: |
          for attempt in 1 2 3; do
            timeout 180 bunx playwright install chromium && exit 0
            echo "::warning::playwright browser download failed or timed out (attempt $attempt of 3)"
            sleep $((attempt * 10))
          done
          exit 1
      - name: Point playwright.config at the installed Chromium
        run: |
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -n 1)"
          test -n "$CHROME" || { echo "chromium not found under ~/.cache/ms-playwright"; exit 1; }
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-syft
      - name: Qualify release
        continue-on-error: false
        run: bun run qualify:release
