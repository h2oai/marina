name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, versions (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        # One root install covers every Bun workspace member (dashboard, site,
        # marina-desktop, examples/*, src/sdk) from the single bun.lock.
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Typecheck verification tools
        run: bunx tsc --ignoreConfig --noEmit --target ESNext --module ESNext --moduleResolution bundler --types bun --strict --skipLibCheck scripts/check-session-model.ts scripts/check-context-benchmark.ts benchmarks/participation-context.ts
      - name: Check workspace versions
        run: bun run check:versions
      - name: Check fast-test selection drift
        run: bun run test:fast --check
      - name: Check generated API references
        run: bun run docs:api --check
      - name: Qualify concurrent MCP participation and admission recovery
        run: bun run qualify:participation:load --directory "$RUNNER_TEMP/participation-load" --participants 4 --records 8 --operations 4
      - name: Preserve participation qualification report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: participation-load-report
          path: ${{ runner.temp }}/participation-load/report.json
          if-no-files-found: ignore

  backend:
    name: Test (backend, shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check shard coverage
        # Every test file lands in exactly one shard (time-balanced from
        # test/timing.json, name-hash fallback for files without a timing).
        run: bun run test:shard --list ${{ matrix.shard }} 3
      - name: Test
        run: bun run test:shard ${{ matrix.shard }} 3

  dashboard:
    name: Test and build (dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        # Workspace install from the repo root; the dashboard has no lockfile.
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
      - name: Typecheck
        # Vite only transpiles; tsc is the only thing that checks dashboard/src
        # (the root tsconfig excludes it).
        run: bun run typecheck
      - name: Build
        run: bun run build

  desktop:
    name: Typecheck and test desktop SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: cd marina-desktop && bun run typecheck
      - name: Test native SDK boundaries
        run: cd marina-desktop && bun run test

  participation-browser:
    name: Participation browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: dashboard
        run: bunx playwright install --with-deps chromium
      - name: Run participation journeys
        run: bun run test:browser
      - name: Run API explorer journeys
        run: bun run test:explorer
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: participation-browser-failures
          path: |
            /tmp/marina-dashboard-browser-results
            /tmp/marina-explorer-browser-results

  participation-invariants:
    name: Participation mutation and model checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - name: Check session model and negative controls
        run: bun run check:model
      - name: Mutation test cache and MCP admission contracts
        run: bun run test:mutation
      - name: Preserve model traces and mutation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: participation-invariants
          path: |
            /tmp/marina-session-model/report.json
            /tmp/marina-session-model/*/tlc.log
            /tmp/marina-mutation/mutation.json

  context-performance:
    name: Context p99 regression (1k and 10k records)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Prepare comparison checkout
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF=$(git rev-parse HEAD^)
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          mkdir -p "$RUNNER_TEMP/marina-context-base"
          git archive "$BASE_REF" | tar -x -C "$RUNNER_TEMP/marina-context-base"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/marina-context-base/node_modules"
      - name: Compare three alternating base/candidate runs
        run: bun run check:context-performance --baseline "$RUNNER_TEMP/marina-context-base"
      - name: Preserve latency samples and comparison
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: context-performance
          path: /tmp/marina-context-regression/
