name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The main-branch merge queue tests each queued PR merged onto current main.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, versions (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        # One root install covers every Bun workspace member (dashboard, site,
        # marina-desktop, examples/*, src/sdk) from the single bun.lock.
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Typecheck verification tools
        run: bunx tsc --ignoreConfig --noEmit --target ESNext --module ESNext --moduleResolution bundler --types bun --strict --skipLibCheck scripts/check-session-model.ts scripts/check-context-benchmark.ts benchmarks/participation-context.ts scripts/qualify-investigations.ts scripts/qualify-investigations-live.ts scripts/qualify-investigation-replay.ts
      - name: Check workspace versions
        run: bun run check:versions
      - name: Check fast-test selection drift
        run: bun run test:fast --check
      - name: Check generated API references
        run: bun run docs:api --check
      - name: Qualify standalone CLI without Bun or checkout on PATH
        run: bun run qualify:native
      - name: Qualify concurrent MCP participation and admission recovery
        run: bun run qualify:participation:load --directory "$RUNNER_TEMP/participation-load" --participants 4 --records 8 --operations 4
      - name: Qualify private investigation resource limits without providers
        run: bun run qualify:investigations "$RUNNER_TEMP/investigation-qualification"
      - name: Preserve investigation qualification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: investigation-qualification-report
          path: ${{ runner.temp }}/investigation-qualification/run-*/report.json
          if-no-files-found: ignore
      - name: Preserve participation qualification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: participation-load-report
          path: ${{ runner.temp }}/participation-load/report.json
          if-no-files-found: ignore

  backend:
    name: Test (backend, shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install media tools
        # ffmpeg/ffprobe and poppler (pdftotext, pdftoppm): the media, asset
        # library and asset memory tests skip their tool paths without them.
        # Cached and bounded: a crawling Ubuntu mirror used to eat the whole
        # job timeout and drop PRs from the merge queue. Optional: on a
        # failed install those tests skip their tool paths (with a warning).
        timeout-minutes: 10
        uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg poppler-utils
          optional: "true"
      - name: Check shard coverage
        # Every test file lands in exactly one shard (time-balanced from
        # test/timing.json, name-hash fallback for files without a timing).
        run: bun run test:shard --list ${{ matrix.shard }} 3
      - name: Test
        run: bun run test:shard ${{ matrix.shard }} 3

  dashboard:
    name: Test and build (dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up dashboard test runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: dashboard/.node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        # Workspace install from the repo root; the dashboard has no lockfile.
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
      - name: Typecheck
        # Vite only transpiles; tsc is the only thing that checks dashboard/src
        # (the root tsconfig excludes it).
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Qualify bundled server and Node SDK
        working-directory: .
        run: bun run build:sdk && bun run qualify:server

  desktop:
    name: Build and test desktop v2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Sync Electrobun SDK
        run: cd marina-desktop && bun run sync
      - name: Typecheck
        run: cd marina-desktop && bun run typecheck
      - name: Test native SDK boundaries
        run: cd marina-desktop && bun run test
      - name: Install native smoke dependencies
        timeout-minutes: 6
        uses: ./.github/actions/apt-install
        with:
          attempt-seconds: "150"
          packages: libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2 xvfb imagemagick
      - name: Build native app
        run: cd marina-desktop && bun run build:dev
      - name: Launch and drain the native app
        run: cd marina-desktop && xvfb-run -a -s '-screen 0 1440x1000x24' bun scripts/native-smoke.ts
      - name: Preserve native smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-native-smoke
          path: |
            marina-desktop/build/native-smoke-*/native.log
            marina-desktop/build/native-smoke-*/desktop.png

  participation-browser:
    name: Participation browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Install Chromium's system libraries
        # Chromium's own libraries from `playwright install --with-deps` on
        # ubuntu-24.04 (headless: no X server or extra fonts), through the cached,
        # bounded apt action, so a crawling mirror fails fast instead of timing out.
        timeout-minutes: 9
        uses: ./.github/actions/apt-install
        with:
          attempt-seconds: "240"
          packages: >-
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2
            libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3
            libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3
            libxkbcommon0 libxrandr2 fonts-liberation
      - name: Install Chromium
        working-directory: dashboard
        # The browser itself comes from the Playwright CDN: each try is bounded.
        run: |
          for attempt in 1 2 3; do
            timeout 180 bunx playwright install chromium && exit 0
            echo "::warning::playwright browser download failed or timed out (attempt $attempt of 3)"
            sleep $((attempt * 10))
          done
          exit 1
      - name: Run participation journeys
        run: bun run test:browser
      - name: Run API explorer journeys
        run: bun run test:explorer
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: participation-browser-failures
          path: |
            /tmp/marina-dashboard-browser-results
            /tmp/marina-explorer-browser-results

  accessibility:
    name: Dashboard accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MARINA_BROWSER_ARTIFACTS: /tmp/marina-accessibility-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Install Chromium's system libraries
        # Chromium's own libraries from `playwright install --with-deps` on
        # ubuntu-24.04 (headless: no X server or extra fonts), through the cached,
        # bounded apt action, so a crawling mirror fails fast instead of timing out.
        timeout-minutes: 9
        uses: ./.github/actions/apt-install
        with:
          attempt-seconds: "240"
          packages: >-
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2
            libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3
            libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3
            libxkbcommon0 libxrandr2 fonts-liberation
      - name: Install Chromium
        working-directory: dashboard
        # The browser itself comes from the Playwright CDN: each try is bounded.
        run: |
          for attempt in 1 2 3; do
            timeout 180 bunx playwright install chromium && exit 0
            echo "::warning::playwright browser download failed or timed out (attempt $attempt of 3)"
            sleep $((attempt * 10))
          done
          exit 1
      - name: Check accessibility contracts and browser journeys
        run: bun run test:a11y
      - name: Preserve accessibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-accessibility
          path: /tmp/marina-accessibility-results

  participation-invariants:
    name: Participation mutation and model checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - name: Check session model and negative controls
        run: bun run check:model
      - name: Mutation test cache and MCP admission contracts
        run: bun run test:mutation
      - name: Preserve model traces and mutation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: participation-invariants
          path: |
            /tmp/marina-session-model/report.json
            /tmp/marina-session-model/*/tlc.log
            /tmp/marina-mutation/mutation.json

  context-performance:
    name: Context p99 regression (1k and 10k records)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Prepare comparison checkout
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF=$(git rev-parse HEAD^)
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          mkdir -p "$RUNNER_TEMP/marina-context-base"
          git archive "$BASE_REF" | tar -x -C "$RUNNER_TEMP/marina-context-base"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/marina-context-base/node_modules"
      - name: Compare three alternating base/candidate runs
        run: bun run check:context-performance --baseline "$RUNNER_TEMP/marina-context-base"
      - name: Preserve latency samples and comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: context-performance
          path: /tmp/marina-context-regression/
