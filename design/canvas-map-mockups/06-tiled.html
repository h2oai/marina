<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Marina — Tiled Dynamic Canvas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--gold:#FFDD00;--amber:#FFB800;--orange:#FF9500;--green:#22c55e;--red:#ef4444;--cyan:#06b6d4;--violet:#8b5cf6;--indigo:#6366f1;--rose:#f472b6;--bg:#030306;--card:rgba(8,8,14,0.96);--border:#111118;--border-hi:rgba(255,221,0,0.15);--text:#d4d4d4;--dim:#555;--bright:#f0f0f0}
  body{background:var(--bg);color:var(--text);font-family:'VT323',monospace;font-size:clamp(18px,1.35vw,28px);overflow:hidden;width:100vw;height:100vh;display:flex;flex-direction:column}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px)}

  /* ═══ TOP BAR ═══ */
  #topbar{height:clamp(38px,2.62vw,56px);background:var(--card);border-bottom:2px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:clamp(12px,1.35vw,24px);flex-shrink:0;z-index:90}
  .logo{font-family:'Orbitron',sans-serif;font-size:clamp(13px,1.12vw,20px);font-weight:700;background:linear-gradient(135deg,var(--gold),var(--amber),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .ci{display:flex;align-items:center;gap:6px} .ci-v{font-family:'Orbitron',sans-serif;font-size:clamp(14px,1.05vw,22px);font-weight:700;color:var(--gold);text-shadow:0 0 4px rgba(255,221,0,0.2)} .ci-l{font-size:clamp(13px,0.9vw,18px);color:#444} .cd{width:1px;height:22px;background:var(--border)}
  #live{display:flex;align-items:center;gap:5px;font-family:'Press Start 2P',monospace;font-size:clamp(7px,0.6vw,10px);color:var(--green);letter-spacing:1px}
  #live::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);animation:lp 1s ease-in-out infinite}
  @keyframes lp{0%,100%{opacity:1}50%{opacity:.4}}

  /* ═══ MAIN LAYOUT: sidebar | center | context ═══ */
  #main{flex:1;display:flex;overflow:hidden;min-height:0}

  .blink{width:4px;height:4px;background:var(--gold);animation:bl 1.5s step-start infinite}@keyframes bl{0%,100%{opacity:1}50%{opacity:0}}
  .ei{display:flex;align-items:center;gap:10px;padding:clamp(6px,0.52vw,8px) 12px;border-bottom:1px solid rgba(17,17,24,0.4);cursor:pointer;transition:background .15s}
  .ei:hover{background:rgba(255,221,0,0.03)} .ei.sel{background:rgba(255,221,0,0.06);border-left:3px solid var(--gold)}
  .ei-d{width:clamp(8px,0.68vw,12px);height:clamp(8px,0.68vw,12px);border-radius:50%;flex-shrink:0}
  .ei-d.ag{background:var(--gold);box-shadow:0 0 5px var(--gold)} .ei-d.hu{background:#f0f0f0;box-shadow:0 0 5px #f0f0f0} .ei-d.np{background:var(--green);box-shadow:0 0 5px var(--green)}
  .ei-i{flex:1;overflow:hidden} .ei-n{font-size:clamp(16px,1.12vw,22px);color:var(--bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .ei-m{font-size:clamp(13px,0.98vw,18px);color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ei-s{font-size:clamp(12px,0.83vw,16px);flex-shrink:0;padding:3px 8px;border-radius:3px}

  /* Center area: map on top, chat on bottom */
  #center{flex:1;display:flex;flex-direction:column;min-width:200px;overflow:hidden}

  /* Map tile */
  #map-tile{flex:1;position:relative;overflow:hidden;cursor:grab;min-height:100px;border-bottom:2px solid var(--border)}
  #map-tile:active{cursor:grabbing}
  #map-tile::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;background-image:linear-gradient(rgba(255,221,0,0.005) 1px,transparent 1px),linear-gradient(90deg,rgba(255,221,0,0.005) 1px,transparent 1px);background-size:3px 3px}
  #world-svg{position:absolute;transform-origin:0 0}

  /* Chat tile */
  #chat-tile{height:clamp(160px,22vh,280px);min-height:80px;max-height:45vh;background:var(--card);display:flex;flex-direction:column;flex-shrink:0;transition:height .2s ease}
  #chat-tile.rolled{height:auto !important;min-height:0}
  #chat-tile.rolled .chat-tabs,#chat-tile.rolled .chat-pane,#chat-tile.rolled .divider-h{display:none}
  #chat-tile.rolled .tile-hdr{border-bottom:none}
  #chat-tile.rolled .tile-hdr .roll-icon::after{content:'▸'}
  #chat-tile:not(.rolled) .tile-hdr .roll-icon::after{content:'▾'}
  .tile-hdr{font-family:'Press Start 2P',monospace;font-size:clamp(8px,0.64vw,11px);text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,221,0,0.5);padding:clamp(6px,0.52vw,8px) 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;flex-shrink:0}
  .tile-hdr .spacer{flex:1}
  .tile-hdr .btn{color:#333;font-family:'VT323',monospace;font-size:clamp(18px,1.12vw,24px);cursor:pointer;padding:2px 6px} .tile-hdr .btn:hover{color:var(--gold)}
  .chat-msgs{flex:1;overflow-y:auto;padding:10px 16px;scrollbar-width:thin;scrollbar-color:#1a1a22 transparent}
  .chat-msg{padding:6px 0;font-size:clamp(18px,1.12vw,24px);line-height:1.5;border-bottom:1px solid rgba(17,17,24,0.3);animation:fadeIn .3s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  .cm-n{color:var(--gold);font-weight:bold;font-size:clamp(17px,1.05vw,22px);cursor:pointer} .cm-n:hover{text-decoration:underline} .cm-t{color:var(--text);font-size:clamp(18px,1.12vw,24px)} .cm-s{color:#555;font-style:italic;font-size:clamp(14px,0.9vw,18px)}
  .chat-ir{display:flex;gap:8px;padding:clamp(6px,0.6vw,10px) 16px;border-top:2px solid var(--border);flex-shrink:0;align-items:flex-end}
  .chat-in{flex:1;background:rgba(17,17,24,0.6);border:2px solid var(--border);color:var(--bright);font-family:'VT323',monospace;font-size:clamp(20px,1.2vw,26px);padding:clamp(6px,0.52vw,10px) 14px;outline:none;resize:none;line-height:1.4}
  .chat-in:focus{border-color:rgba(255,221,0,0.3);box-shadow:0 0 12px rgba(255,221,0,0.06)}

  /* Chat tabs */
  .chat-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
  .chtab{padding:clamp(6px,0.45vw,8px) clamp(10px,0.9vw,16px);font-family:'Press Start 2P',monospace;font-size:clamp(7px,0.56vw,9px);text-transform:uppercase;letter-spacing:.5px;color:#333;cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;position:relative}
  .chtab.on{color:var(--gold);border-bottom-color:var(--gold)} .chtab:hover:not(.on){color:#666}
  .chtab .bdg{position:absolute;top:1px;right:1px;width:5px;height:5px;border-radius:50%;background:var(--cyan);display:none}
  .chtab.unread .bdg{display:block;animation:bl 1s step-start infinite}
  .chat-pane{display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0}
  .chat-pane.on{display:flex}

  /* Tell messages */
  .tell-msg{padding:6px 0;font-size:clamp(17px,1.05vw,22px);line-height:1.4;border-bottom:1px solid rgba(17,17,24,0.3);animation:fadeIn .3s ease}
  .tell-from{color:var(--gold);font-weight:bold;font-size:clamp(16px,0.98vw,20px);cursor:pointer} .tell-from:hover{text-decoration:underline}
  .tell-arrow{color:#444;font-size:clamp(12px,0.75vw,16px);padding:0 4px}
  .tell-to{color:var(--cyan);font-weight:bold;font-size:clamp(16px,0.98vw,20px);cursor:pointer} .tell-to:hover{text-decoration:underline}
  .tell-text{color:var(--text);font-size:clamp(17px,1.05vw,22px);display:block;margin-top:2px}

  /* Channel list & messages */
  .ch-item{display:flex;align-items:center;gap:10px;padding:clamp(6px,0.38vw,8px) 14px;cursor:pointer;border-bottom:1px solid rgba(17,17,24,0.2);transition:background .15s}
  .ch-item:hover{background:rgba(255,221,0,0.03)} .ch-item.sel{background:rgba(255,221,0,0.05);border-left:2px solid var(--gold)}
  .ch-name{font-size:clamp(16px,0.98vw,20px);color:var(--bright);font-weight:bold}
  .ch-hash{color:var(--amber);font-size:clamp(14px,0.9vw,18px);flex-shrink:0}
  .ch-preview{font-size:clamp(12px,0.75vw,16px);color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .ch-count{font-size:clamp(11px,0.68vw,14px);color:#444;flex-shrink:0;padding:2px 6px;background:rgba(255,221,0,0.05);border-radius:2px}
  .ch-msg{padding:5px 14px;font-size:clamp(16px,0.98vw,20px);line-height:1.4;border-bottom:1px solid rgba(17,17,24,0.2);animation:fadeIn .3s ease}
  .ch-msg-n{color:var(--gold);font-weight:bold;font-size:clamp(15px,0.9vw,18px)} .ch-msg-t{color:var(--text);font-size:clamp(16px,0.98vw,20px)}
  .ch-back{font-size:clamp(13px,0.83vw,16px);color:#444;cursor:pointer;padding:8px 14px;border-bottom:1px solid var(--border)} .ch-back:hover{color:var(--gold)}

  /* ═══ CONTEXT PANEL (right split — hidden until something is clicked) ═══ */
  #context{position:fixed;right:12px;top:52px;width:clamp(300px,22vw,440px);max-height:calc(100vh - 120px);background:var(--card);border:2px solid var(--border);box-shadow:6px 6px 0 rgba(0,0,0,0.5);display:none;flex-direction:column;overflow:hidden;z-index:75;backdrop-filter:blur(10px);border-radius:4px}
  #context.open{display:flex}
  #context .tile-hdr{cursor:default}
  /* Cascade sections */
  .cas{border-top:2px solid var(--border);margin-top:0}
  .cas:first-child{border-top:none}
  .cas-hdr{font-family:'Press Start 2P',monospace;font-size:clamp(7px,0.6vw,10px);text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,221,0,0.45);padding:clamp(6px,0.6vw,10px) 12px clamp(6px,0.3vw,8px);cursor:pointer;display:flex;align-items:center;gap:6px}
  .cas-hdr:hover{color:rgba(255,221,0,0.7)}
  .cas-hdr .cas-arrow{font-family:'VT323',monospace;font-size:clamp(14px,0.98vw,20px);color:#444;transition:transform .15s}
  .cas.collapsed .cas-body{display:none}
  .cas.collapsed .cas-arrow{transform:rotate(-90deg)}
  .cas-body{padding:0 12px 8px}
  #ctx-body{flex:1;overflow-y:auto;padding:0;scrollbar-width:thin;scrollbar-color:#1a1a22 transparent}

  /* Context content styles */
  .ctx-name{font-family:'Orbitron',sans-serif;font-size:clamp(18px,1.35vw,28px);font-weight:700;color:var(--gold);padding:12px 14px;text-shadow:0 0 8px rgba(255,221,0,0.2)}
  .ctx-desc{font-size:clamp(15px,1.05vw,22px);color:#666;padding:0 14px 8px}
  .ctx-sec{padding:8px 12px;border-top:1px solid var(--border)}
  .ctx-st{font-family:'Press Start 2P',monospace;font-size:clamp(7px,0.56vw,9px);text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,221,0,0.45);margin-bottom:5px}
  .ctx-row{display:flex;justify-content:space-between;padding:clamp(6px,0.3vw,8px) 0;font-size:clamp(15px,1.05vw,22px);border-bottom:1px solid rgba(17,17,24,0.2)} .ctx-k{color:#555} .ctx-v{color:#aaa} .ctx-v.gold{color:var(--gold)} .ctx-v.green{color:var(--green)} .ctx-v.red{color:var(--red)}
  .ctx-item{font-size:clamp(15px,1.05vw,22px);color:#777;padding:clamp(6px,0.3vw,8px) 0;cursor:pointer} .ctx-item:hover{color:var(--gold)}
  .ctx-src{font-size:clamp(14px,0.98vw,20px);color:#555;padding:10px 12px;background:rgba(17,17,24,0.5);white-space:pre-wrap;font-family:'VT323',monospace;max-height:280px;overflow-y:auto;margin-top:4px;border:1px solid rgba(17,17,24,0.4);line-height:1.5}
  .ctx-mem{padding:clamp(6px,0.38vw,8px) 0;border-bottom:1px solid rgba(17,17,24,0.2)} .ctx-mk{font-size:clamp(13px,0.9vw,18px);color:var(--amber)} .ctx-mv{font-size:clamp(15px,1.05vw,20px);color:#888;margin-top:2px}

  /* Feed inside context panel */
  .fi{display:flex;gap:8px;align-items:baseline;padding:clamp(6px,0.3vw,8px) 12px;border-bottom:1px solid rgba(17,17,24,0.3);font-size:clamp(15px,1.05vw,20px);animation:fadeIn .3s ease}
  .fi-t{color:#444;font-size:clamp(12px,0.83vw,16px);width:clamp(50px,3.38vw,74px);flex-shrink:0} .fi-e{color:var(--gold);flex-shrink:0;cursor:pointer;font-size:clamp(15px,1.05vw,20px)} .fi-e:hover{text-decoration:underline} .fi-a{color:#666;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .fi-a.err{color:var(--red)}

  /* Coordination inside context */
  .co{display:flex;align-items:flex-start;gap:10px;padding:clamp(6px,0.45vw,8px) 12px;border-bottom:1px solid rgba(17,17,24,0.3);cursor:pointer;overflow:hidden} .co:hover{background:rgba(255,221,0,0.02)}
  .co-d{width:clamp(7px,0.6vw,10px);height:clamp(7px,0.6vw,10px);border-radius:50%;flex-shrink:0} .co-d.act{background:var(--green)} .co-d.pen{background:var(--amber)} .co-d.don{background:#444}
  .co-t{font-size:clamp(15px,1.05vw,22px);color:var(--bright);word-break:break-word} .co-m{font-size:clamp(13px,0.9vw,18px);color:#444;word-break:break-word}

  /* ═══ DIVIDER HANDLES ═══ */
  .divider-h{height:6px;cursor:row-resize;background:transparent;position:relative;flex-shrink:0;z-index:10}
  .divider-h:hover,.divider-h.active{background:rgba(255,221,0,0.06)}
  .divider-h::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:2px;background:#222;border-radius:1px}
  .divider-h:hover::after,.divider-h.active::after{background:rgba(255,221,0,0.3)}

  .divider-v{width:6px;cursor:col-resize;background:transparent;position:relative;flex-shrink:0;z-index:10}
  .divider-v:hover,.divider-v.active{background:rgba(255,221,0,0.06)}
  .divider-v::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:2px;height:30px;background:#222;border-radius:1px}
  .divider-v:hover::after,.divider-v.active::after{background:rgba(255,221,0,0.3)}

  /* Full viewer overlay */
  #viewer{position:fixed;inset:0;z-index:100;background:rgba(3,3,6,0.92);backdrop-filter:blur(12px);display:none;flex-direction:column}
  #viewer.open{display:flex}
  #viewer-hdr{display:flex;align-items:center;padding:clamp(6px,0.6vw,10px) clamp(10px,0.9vw,16px);border-bottom:2px solid var(--border);flex-shrink:0;gap:10px}
  #viewer-title{font-family:'Orbitron',sans-serif;font-size:clamp(16px,1.12vw,24px);font-weight:700;color:var(--gold);flex:1}
  #viewer-type{font-size:clamp(10px,0.75vw,12px);padding:2px 8px;border-radius:3px;text-transform:uppercase;letter-spacing:1px}
  #viewer-close{background:none;border:2px solid var(--border);color:#666;font-family:'VT323',monospace;font-size:clamp(18px,1.12vw,24px);cursor:pointer;padding:2px 10px}
  #viewer-close:hover{color:var(--gold);border-color:rgba(255,221,0,0.2)}
  #viewer-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:clamp(14px,1.5vw,36px)}
  #viewer-content{width:100%;max-width:900px;min-height:200px}

  /* Viewer type-specific */
  .vw-img{max-width:100%;max-height:70vh;border:1px solid var(--border);border-radius:4px}
  .vw-video{width:100%;aspect-ratio:16/9;background:#0a0a0f;border:1px solid var(--border);border-radius:4px;display:flex;flex-direction:column;position:relative}
  .vw-video-screen{flex:1;display:flex;align-items:center;justify-content:center}
  .vw-video-controls{padding:clamp(6px,0.6vw,10px) clamp(10px,0.9vw,16px);background:rgba(0,0,0,0.5);display:flex;align-items:center;gap:clamp(8px,0.75vw,12px)}
  .vw-play{font-size:clamp(26px,1.65vw,36px);color:var(--gold);cursor:pointer;flex-shrink:0}
  .vw-play:hover{text-shadow:0 0 12px var(--gold)}
  .vw-bar{flex:1;height:6px;background:#333;border-radius:3px;cursor:pointer;position:relative}
  .vw-bar-fill{height:100%;background:var(--gold);border-radius:3px;width:0%;transition:width .3s}
  .vw-time{font-family:'VT323',monospace;font-size:clamp(14px,0.9vw,18px);color:#666}
  .vw-audio{width:100%;background:#0a0a0f;border:1px solid var(--border);border-radius:4px;padding:clamp(18px,1.5vw,36px)}
  .vw-waveform{display:flex;align-items:end;gap:3px;height:clamp(60px,8vh,120px);margin:clamp(10px,1.12vw,20px) 0}
  .vw-wbar{flex:1;background:var(--gold);border-radius:2px;opacity:.3;transition:opacity .2s;cursor:pointer}
  .vw-wbar:hover{opacity:.6}
  .vw-wbar.played{opacity:.5}
  .vw-pdf{width:100%;background:#111;border:1px solid var(--border);border-radius:4px;display:flex;flex-direction:column}
  .vw-pdf-page{flex:1;padding:clamp(18px,2.25vw,46px);overflow-y:auto;max-height:65vh;font-size:clamp(14px,0.98vw,20px);color:#999;line-height:1.8}
  .vw-pdf-nav{padding:clamp(6px,0.6vw,10px) clamp(14px,1.12vw,20px);border-top:1px solid #222;display:flex;align-items:center;justify-content:space-between}
  .vw-pdf-btn{background:none;border:1px solid var(--border);color:#666;font-family:'VT323',monospace;font-size:clamp(14px,0.9vw,18px);padding:4px 12px;cursor:pointer}
  .vw-pdf-btn:hover{color:var(--gold);border-color:rgba(255,221,0,0.2)}
  .vw-doc{width:100%;background:#0a0a0f;border:1px solid var(--border);border-radius:4px;padding:clamp(18px,2.25vw,46px);min-height:300px}
  .vw-doc-editable{font-size:clamp(16px,1.05vw,22px);color:var(--text);line-height:1.8;outline:none;min-height:200px}
  .vw-doc-editable:focus{box-shadow:inset 0 0 0 1px rgba(255,221,0,0.1)}
  .vw-doc-toolbar{display:flex;gap:6px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
  .vw-doc-tb{background:none;border:1px solid var(--border);color:#555;font-family:'VT323',monospace;font-size:clamp(12px,0.83vw,16px);padding:2px 8px;cursor:pointer}
  .vw-doc-tb:hover{color:var(--gold);border-color:rgba(255,221,0,0.2)}
  .vw-a2ui{width:100%;background:#0a0a0f;border:1px solid var(--indigo);border-radius:4px;padding:clamp(14px,1.5vw,28px)}

  /* Clear view mode — Space to toggle all panels off */
  body.clear-view .fpanel:not(.pinned-visible){opacity:0 !important;pointer-events:none !important;transition:opacity .3s}
  body.clear-view #cmd-bar{opacity:.15;pointer-events:none}
  body.clear-view #context{opacity:0 !important;pointer-events:none !important}
  body.clear-view #clear-indicator{display:flex}

  /* Unfocused panel opacity fade */
  .fpanel{transition:opacity .4s ease,border-color .2s}
  .fpanel.faded{opacity:.25;pointer-events:auto}
  .fpanel.faded:hover{opacity:.9;transition:opacity .15s ease}

  /* Command bar (replaces permanent chat tile as primary input) */
  #cmd-bar{position:fixed;bottom:8px;left:4vw;right:4vw;z-index:85;height:clamp(150px,18vh,260px);display:flex;flex-direction:column;background:var(--card);border:2px solid rgba(255,221,0,0.15);box-shadow:0 -4px 30px rgba(0,0,0,0.5),0 0 20px rgba(255,221,0,0.03);backdrop-filter:blur(16px);border-radius:6px;overflow:hidden}
  #cmd-bar.hidden{opacity:0;pointer-events:none;transform:translateY(20px);transition:all .25s ease}
  #cmd-bar:not(.hidden){transition:opacity .25s ease}
  #cmd-bar-drag{cursor:move;padding:3px 0;display:flex;justify-content:center;flex-shrink:0}
  #cmd-bar-drag::after{content:'';display:block;width:40px;height:3px;background:#222;border-radius:2px}
  #cmd-bar-drag:hover::after{background:rgba(255,221,0,0.3)}
  #cmd-bar .fp-resize{position:absolute;bottom:0;right:0;width:16px;height:16px;cursor:se-resize;z-index:2}
  #cmd-bar .fp-resize::after{content:'';position:absolute;bottom:3px;right:3px;width:9px;height:9px;border-right:2px solid #333;border-bottom:2px solid #333}
  #cmd-bar:hover .fp-resize::after{border-color:rgba(255,221,0,0.3)}

// ═══ ACTIVITY METRICS — drives all animation, nothing decorative ═══
// Sliding window: count events per room/entity in the last N seconds
const WINDOW = 30; // seconds
const activity = {
  byRoom: {},    // roomId → [{time, type}]
  byEntity: {},  // entityName → [{time, type}]
};

function logActivity(entityName, roomId, type) {
  const now = Date.now();
  if (!activity.byRoom[roomId]) activity.byRoom[roomId] = [];
  activity.byRoom[roomId].push({time:now, type});
  if (!activity.byEntity[entityName]) activity.byEntity[entityName] = [];
  activity.byEntity[entityName].push({time:now, type});
}

function trimActivity() {
  const cutoff = Date.now() - WINDOW * 1000;
  for (const [k,v] of Object.entries(activity.byRoom)) activity.byRoom[k] = v.filter(e => e.time > cutoff);
  for (const [k,v] of Object.entries(activity.byEntity)) activity.byEntity[k] = v.filter(e => e.time > cutoff);
}

// Get events/sec for a room or entity in the window
function eventsPerSec(bucket) { return bucket ? bucket.length / WINDOW : 0; }
// Get unique event types in window (diversity of activity)
function eventDiversity(bucket) { return bucket ? new Set(bucket.map(e=>e.type)).size : 0; }
// Last event time
function lastEventAge(bucket) { if(!bucket||!bucket.length) return 99999; return (Date.now()-bucket[bucket.length-1].time)/1000; }

// ═══ SVG RENDERERS (same as 05 — generate from state) ═══
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return`${parseInt(h.substring(0,2),16)},${parseInt(h.substring(2,4),16)},${parseInt(h.substring(4,6),16)}`}

function crownSVG(type,r){
  switch(type){
    case 'hexagon':{const p=[];for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/2;p.push(`${(Math.cos(a)*r).toFixed(1)},${(Math.sin(a)*r).toFixed(1)}`)}return`<polygon points="${p.join(' ')}"/>`}
    case 'octagon':{const p=[];for(let i=0;i<8;i++){const a=Math.PI/4*i-Math.PI/2;p.push(`${(Math.cos(a)*r).toFixed(1)},${(Math.sin(a)*r).toFixed(1)}`)}return`<polygon points="${p.join(' ')}"/>`}
    case 'triangle':return`<polygon points="0,${-r} ${(r*.87).toFixed(1)},${(r*.5).toFixed(1)} ${(-r*.87).toFixed(1)},${(r*.5).toFixed(1)}"/>`;
    case 'diamond':return`<polygon points="0,${-r} ${r*.7},0 0,${r} ${-r*.7},0"/>`;
    case 'circle':return`<circle r="${r}"/>`;
    case 'eye':return`<path d="M ${-r},0 C ${-r*.6},${-r*.7} ${r*.6},${-r*.7} ${r},0 C ${r*.6},${r*.7} ${-r*.6},${r*.7} ${-r},0 Z"/>`;
    default:return`<circle r="${r}"/>`;
  }
}

function renderGrid(){let s='';for(let i=-200;i<1400;i+=120){const o=i%360===0?'rgba(255,221,0,0.05)':'rgba(255,221,0,0.025)';s+=`<line x1="0" y1="${i}" x2="1600" y2="${i+800}" stroke="${o}" stroke-width=".5"/>`;s+=`<line x1="0" y1="${i+600}" x2="1600" y2="${i-200}" stroke="${o}" stroke-width=".5"/>`}document.getElementById('grid-layer').innerHTML=s}

function renderRoom(id,room){
  const color=COLORS[room.district],crown=CROWNS[room.district],t=room.throughput;
  const h=Math.max(20,Math.min(200,t*2.1)),rr=30+t*0.5,cr=12+t*0.15;
  const ents=Object.entries(world.entities).filter(([,e])=>e.room===id);

  // === ACTIVITY METRICS ===
  const bucket = activity.byRoom[id] || [];
  const eps = eventsPerSec(bucket);          // events/sec in window
  const div = eventDiversity(bucket);         // unique command types
  const age = lastEventAge(bucket);           // seconds since last event
  const isActive = eps > 0.05;                // any meaningful activity
  const isHot = eps > 0.5;                    // high activity

  // Ring speed: driven by events/sec. No events → frozen (no animation)
  const ringSpeed = isActive ? Math.max(2, 20 / (eps + 0.1)) : 0;
  // Ring opacity: scales with activity. Idle = nearly invisible
  const ringOp = isActive ? Math.min(0.6, 0.1 + eps * 0.4) : 0.06;
  // Crown rotation: driven by event diversity (more types → faster)
  const crownSpeed = div > 0 ? Math.max(8, 40 / div) : 0;
  // Breathing: strong pulse if recent event, flat if stale
  const breathAmp = age < 5 ? 1.08 : age < 15 ? 1.03 : 1.0;
  const breathDur = age < 5 ? 2 : age < 15 ? 4 : 0;

  let s=`<g transform="translate(${room.x},${room.y})" class="clickable" data-drag="room" data-id="${id}">`;

  // Sonar pulse — only if there was a recent event (< 4s ago)
  if(age < 4){
    s+=`<ellipse rx="10" ry="5" fill="none" stroke="${color}" stroke-width="1.5" opacity="0"><animate attributeName="rx" values="10;${rr+30}" dur="2s" repeatCount="1"/><animate attributeName="ry" values="5;${(rr+30)*0.5}" dur="2s" repeatCount="1"/><animate attributeName="opacity" values=".45;0" dur="2s" repeatCount="1"/></ellipse>`;
  }

  // Outer ring — speed and brightness driven by events/sec
  if(ringSpeed > 0){
    s+=`<ellipse rx="${rr}" ry="${rr*0.5}" fill="none" stroke="${color}" stroke-width="2.5" stroke-dasharray="6 2 2 2" opacity="${ringOp}" filter="url(#g1)"><animate attributeName="stroke-dashoffset" from="0" to="${-rr*2}" dur="${ringSpeed}s" repeatCount="indefinite"/></ellipse>`;
    s+=`<ellipse rx="${rr}" ry="${rr*0.5}" fill="none" stroke="${color}" stroke-width="5" stroke-dasharray="1.5 14" opacity="${ringOp*0.3}"><animate attributeName="stroke-dashoffset" from="0" to="${-rr*2}" dur="${ringSpeed}s" repeatCount="indefinite"/></ellipse>`;
  } else {
    // Frozen ring — static, dim
    s+=`<ellipse rx="${rr}" ry="${rr*0.5}" fill="none" stroke="${color}" stroke-width="1.5" stroke-dasharray="6 2 2 2" opacity=".06"/>`;
  }

  // Inner ring — only if high activity, counter-spin
  if(isHot){
    s+=`<ellipse rx="${rr*0.75}" ry="${rr*0.375}" fill="none" stroke="${color}" stroke-width="1.8" stroke-dasharray="3 5" opacity="${ringOp*0.6}"><animate attributeName="stroke-dashoffset" from="0" to="${rr*1.5}" dur="${ringSpeed*1.6}s" repeatCount="indefinite"/></ellipse>`;
  }

  // Column beam — always present (structural), brightness = activity
  const colOp = isActive ? 0.45 : 0.15;
  s+=`<line x1="0" y1="0" x2="0" y2="${-h}" stroke="${color}" stroke-width="2.5" opacity="${colOp}"/><line x1="0" y1="0" x2="0" y2="${-h}" stroke="${color}" stroke-width="10" opacity="${colOp*0.1}" filter="url(#g1)"/>`;
  for(let ty=35;ty<h;ty+=35)s+=`<line x1="-4" y1="${-ty}" x2="4" y2="${-ty}" stroke="${color}" stroke-width=".5" opacity="${(colOp*0.3)-ty*0.0005}"/>`;

  // Data pulse up column — only if active (represents actual command flow)
  if(isActive){
    const pulseDur = Math.max(0.8, 2 / (eps + 0.1));
    s+=`<rect x="-2" width="4" height="5" fill="${color}" opacity="0"><animate attributeName="y" values="0;${-h}" dur="${pulseDur}s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0" dur="${pulseDur}s" repeatCount="indefinite"/></rect>`;
  }

  // Crown — rotation driven by event diversity, breathing by recency
  s+=`<g transform="translate(0,${-h})">`;
  if(crownSpeed > 0){
    s+=`<g fill="rgba(${hexToRgb(color)},0.07)" stroke="${color}" stroke-width="1" opacity="${isActive?.65:.2}"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="${crownSpeed}s" repeatCount="indefinite"/>${crownSVG(crown,cr)}</g>`;
    s+=`<g fill="rgba(${hexToRgb(color)},0.04)" stroke="${color}" stroke-width=".5" opacity="${isActive?.35:.1}"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="${crownSpeed*0.7}s" repeatCount="indefinite"/>${crownSVG(crown,cr*0.6)}</g>`;
  } else {
    // Static crown — no rotation when idle
    s+=`<g fill="rgba(${hexToRgb(color)},0.04)" stroke="${color}" stroke-width="1" opacity=".15">${crownSVG(crown,cr)}</g>`;
  }

  // Core dot — brightness = recency of last event
  const coreBright = age < 3 ? 0.7 : age < 10 ? 0.4 : 0.15;
  s+=`<circle r="${3+t*0.03}" fill="${color}" opacity="${coreBright}" filter="url(#g1)"/>`;

  // Breathing — only if recent event drove it
  if(breathDur > 0){
    s+=`<animateTransform attributeName="transform" type="scale" values="1;${breathAmp};1" dur="${breathDur}s" repeatCount="indefinite" additive="sum"/>`;
  }
  s+=`</g>`;
  ents.forEach(([eid,ent],i)=>{
    const ey=-(h*0.3+i*28),ex=(i%2===0?-1:1)*(16+i*6);
    const ec=ent.kind==='human'?'#f0f0f0':ent.kind==='npc'?'var(--green)':'var(--gold)';
    const stateColor={thinking:'var(--gold)',working:'var(--green)',speaking:'var(--cyan)',idle:'#444',error:'var(--red)',online:'#f0f0f0'}[ent.state]||ec;
    const r=ent.kind==='human'?10:8;

    s+=`<g transform="translate(${ex},${ey})" class="clickable" data-drag="entity" data-id="${eid}" data-room="${id}">`;

    // State ring — always visible, color = state
    if(ent.state==='thinking'){
      s+=`<circle r="${r+6}" fill="none" stroke="${stateColor}" stroke-width="1.5" opacity=".4" stroke-dasharray="3 3"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.5s" repeatCount="indefinite"/></circle>`;
      s+=`<circle r="${r+6}" fill="none" stroke="${stateColor}" stroke-width=".8" opacity="0"><animate attributeName="r" values="${r+6};${r+16}" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".3;0" dur="2s" repeatCount="indefinite"/></circle>`;
    } else if(ent.state==='working'){
      s+=`<circle r="${r+5}" fill="none" stroke="${stateColor}" stroke-width="2" opacity=".35" stroke-dasharray="4 2"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1s" repeatCount="indefinite"/></circle>`;
    } else if(ent.state==='speaking'){
      s+=`<circle r="${r+5}" fill="none" stroke="${stateColor}" stroke-width="1.5" opacity=".5" stroke-dasharray="2 2"><animate attributeName="stroke-dashoffset" from="0" to="-12" dur=".6s" repeatCount="indefinite"/></circle>`;
      s+=`<circle r="${r+5}" fill="none" stroke="${stateColor}" stroke-width=".6" opacity="0"><animate attributeName="r" values="${r+5};${r+18}" dur="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;0" dur="1.2s" repeatCount="indefinite"/></circle>`;
    } else if(ent.state==='error'){
      s+=`<circle r="${r+5}" fill="none" stroke="${stateColor}" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;.6;0" dur=".8s" repeatCount="indefinite"/></circle>`;
    }

    // Core dot
    s+=`<circle r="${r}" fill="${ec}" opacity="${ent.state==='idle'?'.3':'.85'}" filter="url(#g1)"/>`;

    // Name initial
    s+=`<text text-anchor="middle" y="${r*0.4}" font-family="'Press Start 2P'" font-size="${r*0.9}" fill="${ent.state==='idle'?'#222':'#0a0a0a'}" opacity=".8">${ent.name[0]}</text>`;

    // Name label below
    s+=`<text y="${r+12}" text-anchor="middle" font-family="VT323" font-size="11" fill="${stateColor}" opacity=".7">${ent.name}</text>`;

    // Recent action indicator (flash when they did something recently)
    if(ent._lastAction && Date.now()-ent._lastAction < 3000){
      s+=`<circle r="${r+12}" fill="none" stroke="${stateColor}" stroke-width="1" opacity="0"><animate attributeName="r" values="${r+4};${r+20}" dur="1s" fill="freeze"/><animate attributeName="opacity" values=".5;0" dur="1s" fill="freeze"/></circle>`;
    }

    s+=`</g>`;
  });
  s+=`<text y="${-h-22}" text-anchor="middle" font-family="'Press Start 2P'" font-size="8" fill="${color}" opacity=".65" letter-spacing="1.5">${room.name.toUpperCase()}</text>`;
  s+=`<text y="${-h-10}" text-anchor="middle" font-family="Orbitron" font-size="18" fill="${color}" font-weight="700" filter="url(#g1)">${t}</text>`;
  s+=`</g>`;return s;
}

function renderFlows(){let s='';for(const[id,room]of Object.entries(world.rooms)){for(const eid of room.exits){const target=world.rooms[eid];if(!target||eid<id)continue;const vol=Math.min(room.throughput,target.throughput)*0.4;if(vol<2)continue;const w=Math.max(1,vol*0.12),op=Math.min(0.15,vol*0.003),color=COLORS[room.district];s+=`<path d="M ${room.x} ${room.y} L ${target.x} ${target.y}" fill="none" stroke="${color}" stroke-width="${w+2}" opacity="${op}"/>`;s+=`<path d="M ${room.x} ${room.y} L ${target.x} ${target.y}" fill="none" stroke="${color}" stroke-width="${Math.max(0.8,w*0.5)}" opacity="${op*3}" stroke-dasharray="3 5" filter="url(#g1)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="${Math.max(0.5,2-vol*0.03)}s" repeatCount="indefinite"/></path>`;s+=`<rect width="${Math.min(5,vol*0.15)}" height="${Math.min(5,vol*0.15)}" fill="${color}" opacity="0" filter="url(#g1)"><animateMotion dur="${Math.max(1,3-vol*0.04)}s" repeatCount="indefinite" path="M ${room.x} ${room.y} L ${target.x} ${target.y}"/><animate attributeName="opacity" values="0;.8;.8;0" dur="${Math.max(1,3-vol*0.04)}s" repeatCount="indefinite"/></rect>`}}document.getElementById('flow-layer').innerHTML=s}

function renderWorldRing(){
  const rooms = Object.values(world.rooms);
  if (!rooms.length) { document.getElementById('world-ring-layer')?.remove(); return; }

  // Compute center of all rooms
  let cx=0, cy=0;
  rooms.forEach(r => { cx+=r.x; cy+=r.y; });
  cx /= rooms.length; cy /= rooms.length;

  // Compute radius to encompass all rooms + their canvas nodes
  let maxR = 0;
  rooms.forEach(r => {
    const dx = r.x - cx, dy = r.y - cy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const roomExtent = 100 + r.throughput * 1.5; // room structure + canvas node ring
    maxR = Math.max(maxR, dist + roomExtent);
  });
  // Add padding
  maxR += 80;

  // Total world throughput drives ring speed
  const totalThroughput = rooms.reduce((s,r) => s + r.throughput, 0);
  const ringSpeed = Math.max(4, 40 - totalThroughput * 0.08);
  const entityCount = Object.keys(world.entities).length;

  // Ensure the layer exists
  let layer = document.getElementById('world-ring-layer');
  if (!layer) {
    layer = document.createElementNS('http://www.w3.org/2000/svg','g');
    layer.id = 'world-ring-layer';
    // Insert before grid layer so it's behind everything
    const gridLayer = document.getElementById('grid-layer');
    gridLayer.parentNode.insertBefore(layer, gridLayer);
  }

  const ry = maxR * 0.55; // isometric squish
  let s = '';

  // Ambient glow fill
  s += `<ellipse cx="${cx}" cy="${cy}" rx="${maxR}" ry="${ry}" fill="var(--gold)" opacity=".008" filter="url(#g3)"/>`;

  // Outer ring — bold, bright, wide
  s += `<ellipse cx="${cx}" cy="${cy}" rx="${maxR}" ry="${ry}" fill="none" stroke="var(--gold)" stroke-width="4" stroke-dasharray="14 4 5 4 2 4" opacity=".45" filter="url(#g2)">
    <animate attributeName="stroke-dashoffset" from="0" to="${-maxR*0.4}" dur="${ringSpeed}s" repeatCount="indefinite"/>
  </ellipse>`;

  // Notch ring (thick tick marks)
  s += `<ellipse cx="${cx}" cy="${cy}" rx="${maxR}" ry="${ry}" fill="none" stroke="var(--gold)" stroke-width="10" stroke-dasharray="2.5 ${Math.max(18, Math.floor(maxR*0.12))}" opacity=".15">
    <animate attributeName="stroke-dashoffset" from="0" to="${-maxR*0.4}" dur="${ringSpeed}s" repeatCount="indefinite"/>
  </ellipse>`;

  // Mid ring — counter-spin, wider
  const midR = maxR * 0.9;
  s += `<ellipse cx="${cx}" cy="${cy}" rx="${midR}" ry="${midR*0.55}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-dasharray="8 5 3 5" opacity=".25" filter="url(#g1)">
    <animate attributeName="stroke-dashoffset" from="0" to="${midR*0.35}" dur="${ringSpeed*1.4}s" repeatCount="indefinite"/>
  </ellipse>`;

  // Inner ring — faster, visible
  const innerR = maxR * 0.78;
  s += `<ellipse cx="${cx}" cy="${cy}" rx="${innerR}" ry="${innerR*0.55}" fill="none" stroke="var(--gold)" stroke-width="1.8" stroke-dasharray="4 7" opacity=".15">
    <animate attributeName="stroke-dashoffset" from="0" to="${-innerR*0.3}" dur="${ringSpeed*0.7}s" repeatCount="indefinite"/>
  </ellipse>`;

  // Sonar pulse from world center — brighter
  s += `<ellipse cx="${cx}" cy="${cy}" rx="20" ry="11" fill="none" stroke="var(--gold)" stroke-width="2.5" opacity="0">
    <animate attributeName="rx" values="20;${maxR+30}" dur="${Math.max(3,ringSpeed*0.5)}s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="11;${(maxR+30)*0.55}" dur="${Math.max(3,ringSpeed*0.5)}s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".3;0" dur="${Math.max(3,ringSpeed*0.5)}s" repeatCount="indefinite"/>
  </ellipse>`;
  // Second staggered sonar
  s += `<ellipse cx="${cx}" cy="${cy}" rx="20" ry="11" fill="none" stroke="var(--gold)" stroke-width="1.5" opacity="0">
    <animate attributeName="rx" values="20;${maxR+30}" dur="${Math.max(3,ringSpeed*0.5)}s" repeatCount="indefinite" begin="${ringSpeed*0.25}s"/>
    <animate attributeName="ry" values="11;${(maxR+30)*0.55}" dur="${Math.max(3,ringSpeed*0.5)}s" repeatCount="indefinite" begin="${ringSpeed*0.25}s"/>
    <animate attributeName="opacity" values=".15;0" dur="${Math.max(3,ringSpeed*0.5)}s" repeatCount="indefinite" begin="${ringSpeed*0.25}s"/>
  </ellipse>`;

  // World name label at top of ring — bigger, brighter
  s += `<text x="${cx}" y="${cy - ry - 20}" text-anchor="middle" font-family="'Press Start 2P'" font-size="14" fill="var(--gold)" opacity=".4" letter-spacing="4">${world.name.toUpperCase()}</text>`;

  // Stats label at bottom of ring
  s += `<text x="${cx}" y="${cy + ry + 28}" text-anchor="middle" font-family="VT323" font-size="16" fill="var(--gold)" opacity=".25">${rooms.length} rooms · ${entityCount} entities · ${totalThroughput} msg/hr</text>`;

  layer.innerHTML = s;
}

const INTENT_COLORS = { pending:'var(--amber)', active:'var(--cyan)', done:'var(--green)', failed:'var(--red)' };

// ═══ AUTO-LAYOUT: distribute canvas nodes around rooms, avoid overlaps ═══
// ═══ INTERACTION ARCS — visible agent-to-agent communication on the map ═══
const interactions = []; // {from, to, type, color, time}

function addInteraction(fromName, toName, type) {
  const color = {say:'var(--cyan)',tell:'var(--violet)',task:'var(--green)',recall:'var(--amber)'}[type]||'var(--gold)';
  interactions.push({from:fromName, to:toName, type, color, time:Date.now()});
  // Mark agents as having recent action
  const fe = Object.values(world.entities).find(e=>e.name===fromName);
  if(fe) fe._lastAction = Date.now();
  // Keep max 20 interactions, expire after 6 seconds
  while(interactions.length > 20) interactions.shift();
}

function getEntityWorldPos(name) {
  const entry = Object.entries(world.entities).find(([,e])=>e.name===name);
  if(!entry) return null;
  const [eid,ent] = entry;
  const room = world.rooms[ent.room];
  if(!room) return null;
  const ents = Object.entries(world.entities).filter(([,e])=>e.room===ent.room);
  const idx = ents.findIndex(([id])=>id===eid);
  const h = Math.max(20, Math.min(200, room.throughput*2.1));
  const ey = -(h*0.3+idx*28);
  const ex = (idx%2===0?-1:1)*(16+idx*6);
  return {x: room.x+ex, y: room.y+ey};
}

function renderInteractions() {
  const now = Date.now();
  let s = '';
  for(let i=interactions.length-1; i>=0; i--) {
    const arc = interactions[i];
    const age = now - arc.time;
    if(age > 6000) { interactions.splice(i,1); continue; }

    const fromPos = getEntityWorldPos(arc.from);
    const toPos = getEntityWorldPos(arc.to);
    if(!fromPos || !toPos) continue;

    const fade = Math.max(0, 1 - age/6000);
    const midX = (fromPos.x+toPos.x)/2;
    const midY = Math.min(fromPos.y,toPos.y) - 40 - Math.abs(fromPos.x-toPos.x)*0.15;

    // Arc line
    s += `<path d="M ${fromPos.x} ${fromPos.y} Q ${midX} ${midY} ${toPos.x} ${toPos.y}" fill="none" stroke="${arc.color}" stroke-width="${2+fade*2}" opacity="${fade*0.5}" filter="url(#g1)" stroke-dasharray="5 3">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.8s" repeatCount="indefinite"/>
    </path>`;

    // Particle along arc
    s += `<circle r="${2+fade*2}" fill="${arc.color}" opacity="0" filter="url(#g1)">
      <animateMotion dur="${0.8+age*0.0003}s" repeatCount="indefinite" path="M ${fromPos.x} ${fromPos.y} Q ${midX} ${midY} ${toPos.x} ${toPos.y}"/>
      <animate attributeName="opacity" values="0;${fade*0.8};${fade*0.8};0" dur="${0.8+age*0.0003}s" repeatCount="indefinite"/>
    </circle>`;

    // Type label at midpoint (brief)
    if(age < 2000) {
      s += `<text x="${midX}" y="${midY-8}" text-anchor="middle" font-family="'Press Start 2P'" font-size="6" fill="${arc.color}" opacity="${fade*0.5}" letter-spacing="1">${arc.type.toUpperCase()}</text>`;
    }
  }
  document.getElementById('interaction-layer').innerHTML = s;
}

function autoLayout() {
  const roomEntries = Object.entries(world.rooms);
  const cx = 800, cy = 550; // world center

  // ═══ 1. ROOM FORCE-DIRECTED LAYOUT ═══
  // Rooms without _pinned get positioned by forces:
  //   - attraction toward center (prevents drift)
  //   - attraction along exits (connected rooms pull toward each other)
  //   - repulsion between all rooms (prevents overlap)
  //   - size-aware spacing (busier rooms need more space)

  // Initialize rooms without positions to a circle around center
  const unpinnedRooms = roomEntries.filter(([,r]) => !r._pinned);
  unpinnedRooms.forEach(([id, r], i) => {
    if (r.x === 0 && r.y === 0) {
      // New room with no position — place on initial circle
      const angle = (2 * Math.PI * i / Math.max(unpinnedRooms.length, 1)) - Math.PI / 2;
      const radius = 180 + unpinnedRooms.length * 15;
      r.x = cx + Math.cos(angle) * radius;
      r.y = cy + Math.sin(angle) * radius * 0.65;
    }
  });

  // Force iterations (light — just nudge, don't fully solve)
  for (let iter = 0; iter < 5; iter++) {
    for (const [idA, a] of roomEntries) {
      if (a._pinned) continue;
      let fx = 0, fy = 0;
      const sizeA = 80 + a.throughput * 1.2;

      // Gentle pull toward center
      fx += (cx - a.x) * 0.003;
      fy += (cy - a.y) * 0.003;

      // Exit attraction: connected rooms want to be ~(sizeA+sizeB) apart
      for (const exitId of a.exits) {
        const b = world.rooms[exitId];
        if (!b) continue;
        const sizeB = 80 + b.throughput * 1.2;
        const idealDist = sizeA * 0.5 + sizeB * 0.5 + 180;
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const pull = (dist - idealDist) * 0.02;
        fx += (dx / dist) * pull;
        fy += (dy / dist) * pull;
      }

      // Repulsion from all other rooms
      for (const [idB, b] of roomEntries) {
        if (idA === idB) continue;
        const sizeB = 80 + b.throughput * 1.2;
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const minDist = sizeA * 0.5 + sizeB * 0.5 + 120;
        if (dist < minDist) {
          const push = (minDist - dist) * 0.15;
          fx -= (dx / dist) * push;
          fy -= (dy / dist) * push;
        }
      }

      a.x += fx;
      a.y += fy;
    }
  }

  // ═══ 2. CANVAS NODE RING LAYOUT ═══
  const byRoom = {};
  for (const [id, cn] of Object.entries(world.canvasNodes)) {
    if (cn._pinned) continue;
    if (!byRoom[cn.room]) byRoom[cn.room] = [];
    byRoom[cn.room].push(id);
  }

  for (const [roomId, nodeIds] of Object.entries(byRoom)) {
    const room = world.rooms[roomId];
    if (!room) continue;
    const n = nodeIds.length;
    const isMedia = (id) => ['image','video','audio','pdf','document'].includes(world.canvasNodes[id].type);
    // Ring radius: must clear the room structure (rings + column height + labels)
    const roomVisualR = 50 + room.throughput * 1.2; // spinning ring extent
    const baseR = roomVisualR + 60 + n * 18; // clear room structure + spacing per node
    const startAngle = -Math.PI * 0.6;

    nodeIds.forEach((id, i) => {
      const cn = world.canvasNodes[id];
      const angle = startAngle + (2 * Math.PI * i / n);
      // Media cards are much bigger — push them further out
      const r = isMedia(id) ? baseR + 60 : baseR;
      cn.ox = Math.cos(angle) * r;
      cn.oy = Math.sin(angle) * r * 0.55; // squish Y for isometric
    });
  }

  // ═══ 3. CANVAS NODE COLLISION REPULSION ═══
  // Also repel canvas nodes away from room centers they don't belong to
  const allNodes = Object.entries(world.canvasNodes);
  for (const [nid, cn] of allNodes) {
    if (cn._pinned) continue;
    const myRoom = world.rooms[cn.room];
    if (!myRoom) continue;
    const nx = myRoom.x + cn.ox, ny = myRoom.y + cn.oy;
    const nodeSize = ['image','video','audio','pdf','document'].includes(cn.type) ? 60 : 30;
    for (const [rid, r] of roomEntries) {
      if (rid === cn.room) continue;
      const dx = nx - r.x, dy = ny - r.y;
      const dist = Math.sqrt(dx*dx+dy*dy) || 1;
      const roomR = 60 + r.throughput * 0.8;
      const minD = roomR + nodeSize + 30;
      if (dist < minD) {
        const push = (minD - dist) * 0.3;
        cn.ox += (dx/dist) * push;
        cn.oy += (dy/dist) * push;
      }
    }
  }

  // Node-to-node collision repulsion (more passes, bigger sizes, wider gap)
  for (let pass = 0; pass < 6; pass++) {
    for (let i = 0; i < allNodes.length; i++) {
      const [idA, a] = allNodes[i];
      if (a._pinned) continue;
      const roomA = world.rooms[a.room];
      if (!roomA) continue;
      const ax = roomA.x + a.ox, ay = roomA.y + a.oy;
      // Collision radius accounts for full card + label
      const sizeA = ['image','video','audio','pdf','document'].includes(a.type) ? 65 : 30;

      for (let j = i + 1; j < allNodes.length; j++) {
        const [idB, b] = allNodes[j];
        const roomB = world.rooms[b.room];
        if (!roomB) continue;
        const bx = roomB.x + b.ox, by = roomB.y + b.oy;
        const sizeB = ['image','video','audio','pdf','document'].includes(b.type) ? 65 : 30;

        const dx = bx - ax, dy = by - ay;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const minDist = sizeA + sizeB + 30;

        if (dist < minDist && dist > 0) {
          const push = (minDist - dist) / 2;
          const nx = dx / dist, ny = dy / dist;
          if (!a._pinned) { a.ox -= nx * push; a.oy -= ny * push; }
          if (!b._pinned) { b.ox += nx * push; b.oy += ny * push; }
        }
      }
    }
  }
}

function renderCanvasNodes() {
  let s = '';
  for (const [id, cn] of Object.entries(world.canvasNodes)) {
    const room = world.rooms[cn.room];
    if (!room) continue;
    const wx = room.x + cn.ox;
    const wy = room.y + cn.oy;
    const c = cn.intent ? (INTENT_COLORS[cn.intent.status] || cn.color) : cn.color;
    const shapeFn = CNODE_SHAPES[cn.type] || CNODE_SHAPES.text;

    s += `<g transform="translate(${wx},${wy})" class="clickable" data-drag="canvas" data-id="${id}">`;

    // Imported item: distinctive rose outer ring + corner badge
    if (cn.origin === 'imported') {
      s += `<circle r="24" fill="none" stroke="var(--rose)" stroke-width="2" opacity=".35" stroke-dasharray="6 3"/>`;
      s += `<circle r="24" fill="none" stroke="var(--rose)" stroke-width=".8" opacity=".12"/>`;
      // Upload arrow badge
      s += `<g transform="translate(14,-14)"><circle r="6" fill="var(--rose)" opacity=".5"/><text text-anchor="middle" y="3" font-family="VT323" font-size="9" fill="#fff" opacity=".9">↑</text></g>`;
    }

    // Intent status glow ring
    if (cn.intent) {
      const ic = INTENT_COLORS[cn.intent.status];
      if (cn.intent.status === 'pending') {
        s += `<circle r="20" fill="none" stroke="${ic}" stroke-width="1" opacity=".3" stroke-dasharray="3 3"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="2s" repeatCount="indefinite"/></circle>`;
      } else if (cn.intent.status === 'active') {
        s += `<circle r="22" fill="none" stroke="${ic}" stroke-width="1.5" opacity=".4" stroke-dasharray="4 2"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1s" repeatCount="indefinite"/></circle>`;
        s += `<circle r="22" fill="none" stroke="${ic}" stroke-width=".5" opacity="0"><animate attributeName="r" values="22;35" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".3;0" dur="2s" repeatCount="indefinite"/></circle>`;
      } else if (cn.intent.status === 'done') {
        s += `<circle r="20" fill="none" stroke="${ic}" stroke-width="1" opacity=".25"/>`;
      }
    }

    // Shape — rich preview for media types, icon for others
    const isMedia = ['image','video','audio','pdf','document'].includes(cn.type);
    if (isMedia) {
      const tw=80, th=cn.type==='pdf'||cn.type==='document'?90:56;
      // Card background
      s += `<rect x="${-tw/2}" y="${-th/2}" width="${tw}" height="${th}" rx="3" fill="rgba(10,10,16,0.92)" stroke="${c}" stroke-width="1" opacity=".8"/>`;

      if (cn.type === 'image') {
        // Mini landscape thumbnail
        s += `<polygon points="${-tw/2+6},${th/2-10} ${-tw/2+18},${-th/2+14} ${-tw/2+28},${-th/2+22} ${tw/2-6},${th/2-10}" fill="${c}" opacity=".12"/>`;
        s += `<circle cx="${tw/2-16}" cy="${-th/2+14}" r="6" fill="${c}" opacity=".12"/>`;
        // Type badge
        s += `<text x="${-tw/2+6}" y="${-th/2+10}" font-family="'Press Start 2P'" font-size="4" fill="${c}" opacity=".5">IMG</text>`;
      } else if (cn.type === 'video') {
        // Dark frame with play button
        s += `<rect x="${-tw/2+3}" y="${-th/2+3}" width="${tw-6}" height="${th-16}" rx="2" fill="#080810"/>`;
        s += `<polygon points="-6,-8 -6,8 8,0" fill="${c}" opacity=".35"/>`;
        // Duration bar
        s += `<rect x="${-tw/2+3}" y="${th/2-10}" width="${tw-6}" height="7" rx="1" fill="rgba(0,0,0,0.5)"/>`;
        s += `<text x="${tw/2-8}" y="${th/2-5}" text-anchor="end" font-family="VT323" font-size="6" fill="#666">${cn.media?.duration||''}</text>`;
        s += `<text x="${-tw/2+6}" y="${-th/2+10}" font-family="'Press Start 2P'" font-size="4" fill="${c}" opacity=".5">VID</text>`;
      } else if (cn.type === 'audio') {
        // Waveform bars
        const bars = 18;
        for (let i=0;i<bars;i++) {
          const bh = 4 + Math.sin(i*0.8+id.charCodeAt(0))*12 + Math.random()*6;
          const bx = -tw/2 + 8 + i*(tw-16)/bars;
          s += `<rect x="${bx}" y="${-bh/2}" width="2.5" height="${bh}" rx="1" fill="${c}" opacity="${0.15+Math.random()*0.2}"/>`;
        }
        // Play icon left
        s += `<polygon points="${-tw/2+8},-6 ${-tw/2+8},6 ${-tw/2+16},0" fill="${c}" opacity=".4"/>`;
        s += `<text x="${tw/2-8}" y="${th/2-6}" text-anchor="end" font-family="VT323" font-size="6" fill="#666">${cn.media?.duration||''}</text>`;
        s += `<text x="${-tw/2+6}" y="${-th/2+10}" font-family="'Press Start 2P'" font-size="4" fill="${c}" opacity=".5">AUD</text>`;
      } else if (cn.type === 'pdf') {
        // Mini page with text lines
        s += `<rect x="${-tw/2+6}" y="${-th/2+12}" width="${tw-12}" height="${th-18}" rx="1" fill="#111" stroke="#222" stroke-width=".5"/>`;
        for (let ly=0;ly<5;ly++) {
          const lw = tw-28 - (ly===4?16:ly===2?8:0);
          s += `<rect x="${-tw/2+12}" y="${-th/2+18+ly*7}" width="${lw}" height="2" rx="1" fill="#333" opacity=".5"/>`;
        }
        // Folded corner
        s += `<polygon points="${tw/2-12},${-th/2+12} ${tw/2-6},${-th/2+18} ${tw/2-12},${-th/2+18}" fill="#222"/>`;
        s += `<text x="${-tw/2+6}" y="${-th/2+10}" font-family="'Press Start 2P'" font-size="4" fill="${c}" opacity=".5">PDF</text>`;
        s += `<text x="0" y="${th/2-4}" text-anchor="middle" font-family="VT323" font-size="6" fill="#444">pg 1</text>`;
      } else if (cn.type === 'document') {
        // Rich text preview lines
        s += `<rect x="${-tw/2+4}" y="${-th/2+12}" width="${tw-8}" height="9" rx="1" fill="${c}" opacity=".08"/>`;
        for (let ly=0;ly<4;ly++) {
          const lw = tw-20 - (ly===3?20:ly===1?10:0);
          s += `<rect x="${-tw/2+8}" y="${-th/2+26+ly*7}" width="${lw}" height="2" rx="1" fill="#444" opacity=".4"/>`;
        }
        s += `<text x="${-tw/2+6}" y="${-th/2+10}" font-family="'Press Start 2P'" font-size="4" fill="${c}" opacity=".5">DOC</text>`;
      }

      // Title below card
      s += `<text y="${th/2+12}" text-anchor="middle" font-family="VT323" font-size="10" fill="${c}" opacity=".65">${cn.title.length>16?cn.title.substring(0,15)+'…':cn.title}</text>`;
    } else {
      // Small icon for intent, text, a2ui
      s += `<g opacity=".85">${shapeFn(c)}</g>`;
      s += `<text y="${cn.type==='intent'?24:20}" text-anchor="middle" font-family="VT323" font-size="11" fill="${c}" opacity=".7">${cn.title.length>18?cn.title.substring(0,17)+'…':cn.title}</text>`;
    }

    // Intent status badge
    if (cn.intent) {
      const ic = INTENT_COLORS[cn.intent.status];
      s += `<text y="${cn.type==='document'?36:34}" text-anchor="middle" font-family="'Press Start 2P'" font-size="5" fill="${ic}" opacity=".6" letter-spacing=".5">${cn.intent.status.toUpperCase()}</text>`;
    }

    s += `</g>`;
  }
  document.getElementById('canvas-layer').innerHTML = s;
}

function renderRelations() {

    const room = world.rooms[cn.room];
    if (!room) continue;
    const wx = room.x + cn.ox;
    const wy = room.y + cn.oy;
    const c = cn.intent ? (INTENT_COLORS[cn.intent.status] || cn.color) : cn.color;

    // Line from canvas node to its room center
    s += `<line x1="${wx}" y1="${wy}" x2="${room.x}" y2="${room.y}" stroke="${c}" stroke-width=".5" opacity=".1" stroke-dasharray="2 4"/>`;

    // If intent is active/claimed, draw line to the claiming entity
    if (cn.intent?.claimedBy) {

      if (claimer) {

}

// ═══ CONTEXT PANEL (tiled detail view) ═══
let currentCtx = null;

function openContext(type, id) {
  // Toggle: click same thing again → close
  if (currentCtx && currentCtx.type === type && currentCtx.id === id) {
    closeContext(); return;
  }
  currentCtx = {type, id};
  document.getElementById('context').classList.add('open');
  renderContext();
  // Auto-zoom to the clicked object
  autoZoomTo(type, id);
}

function closeContext() {
  document.getElementById('context').classList.remove('open');
  currentCtx = null;
}

// ═══ AUTO-ZOOM ═══
function autoZoomTo(type, id) {
  let wx, wy;
  if (type === 'room') {
    const r = world.rooms[id]; if (!r) return;
    wx = r.x; wy = r.y - r.throughput * 0.8; // center a bit above base to show the structure
  } else if (type === 'entity') {
    const e = world.entities[id]; if (!e) return;
    const r = world.rooms[e.room]; if (!r) return;
    // Find entity's position along the column
    const ents = Object.entries(world.entities).filter(([,ent]) => ent.room === e.room);
    const idx = ents.findIndex(([eid]) => eid === id);
    const h = Math.max(20, Math.min(200, r.throughput * 2.1));
    const ey = -(h * 0.3 + idx * 22);
    wx = r.x; wy = r.y + ey;
  } else if (type === 'canvas') {
    const cn = world.canvasNodes[id]; if (!cn) return;
    const r = world.rooms[cn.room]; if (!r) return;
    wx = r.x + cn.ox; wy = r.y + cn.oy;
  } else return;

  const targetScale = 1.8; // zoom in close to see detail + relationships
  const mt = document.getElementById('map-tile');

  // Smooth animate to target, offset from world center
  const wc = worldCenter();
  svg.style.transition = 'transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
  scale = targetScale;
  panX = scale * (wc.x - wx);
  panY = scale * (wc.y - wy);
  updateTransform();
  setTimeout(() => { svg.style.transition = ''; }, 550);
}

const layerVisible = { rooms: true, canvas: true };
function toggleLayer(layer, btn) {
  layerVisible[layer] = !layerVisible[layer];
  btn.classList.toggle('on', layerVisible[layer]);
  btn.style.color = layerVisible[layer] ? (layer === 'rooms' ? 'var(--gold)' : 'var(--cyan)') : '#333';
  document.getElementById(layer === 'rooms' ? 'room-layer' : 'canvas-layer').style.opacity = layerVisible[layer] ? '1' : '0.05';
  document.getElementById('relation-layer').style.opacity = layerVisible.canvas ? '1' : '0';
  if (layer === 'rooms') {
    document.getElementById('flow-layer').style.opacity = layerVisible.rooms ? '1' : '0.05';
    document.getElementById('contour-layer').style.opacity = layerVisible.rooms ? '1' : '0.05';
  }
}

function toggleCas(el) { el.closest('.cas').classList.toggle('collapsed'); }

function renderContext() {
  if (!currentCtx) return;
  const {type, id} = currentCtx;
  const body = document.getElementById('ctx-body');

  if (type === 'room') {
    const r = world.rooms[id];
    const ents = Object.entries(world.entities).filter(([,e]) => e.room === id);
    const roomEvents = world.events.filter(e => ents.some(([,ent]) => ent.name === e.entity)).slice(0, 15);
    const roomTells = world.tells.filter(t => ents.some(([,ent]) => ent.name === t.from || ent.name === t.to)).slice(0, 8);
    document.getElementById('ctx-title').textContent = r.name;

    let h = `<div class="ctx-name">${r.name}</div><div class="ctx-desc">${r.district} district</div>`;

    // Properties
    h += `<div class="cas"><div class="cas-hdr" onclick="toggleCas(this)"><span class="cas-arrow">v</span> Properties</div><div class="cas-body">`;
    h += `<div class="ctx-row"><span class="ctx-k">throughput</span><span class="ctx-v gold">${r.throughput} msg/hr</span></div>`;
    h += `<div class="ctx-row"><span class="ctx-k">entities</span><span class="ctx-v">${ents.length}</span></div>`;
    h += `</div></div>`;

    // Source (right after properties)
    h += `<div class="cas collapsed"><div class="cas-hdr" onclick="toggleCas(this)"><span class="cas-arrow">v</span> Source</div><div class="cas-body">`;
    h += `<div class="ctx-src">${r.source.replace(/</g,'&lt;')}</div>`;
    h += `</div></div>`;

    // Entities (clickable → drill into entity)
    h += `<div class="cas"><div class="cas-hdr" onclick="toggleCas(this)"><span class="cas-arrow">v</span> Entities (${ents.length})</div><div class="cas-body">`;
    ents.forEach(([eid,e]) => {
      const sc = STATE_COLORS[e.state]||'#888';
      h += `<div class="ctx-item" onclick="openContext('entity','${eid}')" style="display:flex;align-items:center;gap:6px;padding:4px 0">
        <span style="width:6px;height:6px;border-radius:50%;background:${e.kind==='agent'?'var(--gold)':e.kind==='human'?'#f0f0f0':'var(--green)'};flex-shrink:0"></span>
        <span style="color:var(--bright);flex:1">${e.name}</span>
        <span style="font-size:12px;color:${sc}">${e.state}</span>
      </div>`;
    });
    if (!ents.length) h += `<div style="color:#333;padding:4px 0">empty</div>`;
    h += `</div></div>`;

    // Items in room
    if(r.items && r.items.length){
      h += `<div class="cas"><div class="cas-hdr" onclick="toggleCas(this)"><span class="cas-arrow">v</span> Items (${r.items.length})</div><div class="cas-body">`;
      r.items.forEach(item => {
        h += `<div style="padding:4px 0;border-bottom:1px solid rgba(17,17,24,0.2)"><div style="color:var(--bright);font-size:clamp(14px,1vw,20px)">${item.name}</div><div style="color:#555;font-size:clamp(12px,0.9vw,16px)">${item.desc}</div></div>`;
      });
      h += `</div></div>`;
    }

    // Exits (clickable → drill into room)
    h += `<div class="cas"><div class="cas-hdr" onclick="toggleCas(this)"><span class="cas-arrow">v</span> Exits (${r.exits.length})</div><div class="cas-body">`;
    r.exits.forEach(eid => {
      const er = world.rooms[eid];
      h += `<div class="ctx-item" onclick="openContext('room','${eid}')" style="display:flex;align-items:center;gap:6px;padding:3px 0">
        <span style="color:var(--amber)">→</span>
        <span style="color:var(--bright)">${er?.name||eid}</span>
        <span style="font-size:12px;color:#444;margin-left:auto">${er?.throughput||0} msg/hr</span>
      </div>`;
    });
    h += `</div></div>`;

    // Canvas nodes in this room
    const roomCanvas = Object.entries(world.canvasNodes).filter(([,cn]) => cn.room === id);
    if (roomCanvas.length) {
      h += `<div class="cas"><div class="cas-hdr" onclick="toggleCas(this)"><span class="cas-arrow">v</span> Canvas (${roomCanvas.length})</div><div class="cas-body">`;
      roomCanvas.forEach(([cid,cn]) => {
        const cc = cn.intent ? INTENT_COLORS[cn.intent.status] : cn.color;
        const icon = cn.type==='intent'?'◆':cn.type==='a2ui'?'▣':cn.type==='image'?'◻':cn.type==='pdf'?'▧':cn.type==='document'?'▪':'·';
        const imported = cn.origin==='imported';
        h += `<div class="ctx-item" onclick="openContext('canvas','${cid}')" style="display:flex;align-items:center;gap:6px;padding:4px 0${imported?';border-left:2px solid var(--rose);padding-left:6px':''}">
          <span style="color:${cc};font-size:14px">${icon}</span>
          <div style="flex:1;overflow:hidden"><div style="color:var(--bright);font-size:14px">${cn.title}</div><div style="color:#444;font-size:12px">${cn.type}${imported?' · <span style=color:var(--rose)>imported</span>':''}${cn.intent?' — '+cn.intent.status:''}</div></div>
          ${cn.intent?.claimedBy?`<span style="font-size:11px;color:var(--gold)">${cn.intent.claimedBy}</span>`:''}
        </div>`;
      });
      h += `</div></div>`;
    }

    // Recent activity in this room
    h += `<div class="cas"><div class="cas-hdr" onclick="toggleCas(this)"><span class="cas-arrow">v</span> Activity (${roomEvents.length})</div><div class="cas-body">`;
    if (roomEvents.length) roomEvents.forEach(e => h += `<div class="fi" style="padding:2px 0"><span class="fi-t">${e.time}</span><span class="fi-e" onclick="openContext('entity','${entityIdByName(e.entity)}')">${e.entity}</span><span class="fi-a${e.isError?' err':''}">${e.action}</span></div>`);
    else h += `<div style="color:#333;padding:4px 0">No recent activity</div>`;
    h += `</div></div>`;

    // Tells involving entities in this room
    if (roomTells.length) {
      h += `<div class="cas"><div class="cas-hdr" onclick="toggleCas(this)"><span class="cas-arrow">v</span> Direct Messages (${roomTells.length})</div><div class="cas-body">`;
      roomTells.forEach(t => h += `<div style="padding:3px 0;font-size:14px;border-bottom:1px solid rgba(17,17,24,0.2)"><span style="color:var(--gold)">${t.from}</span><span style="color:#444;padding:0 3px">→</span><span style="color:var(--cyan)">${t.to}</span><div style="color:#888;font-size:13px">${t.text}</div></div>`);
      h += `</div></div>`;
    }

    body.innerHTML = h;

  } else if (type === 'entity') {
    const e = world.entities[id];
    const c = e.kind==='npc'?'var(--green)':e.kind==='human'?'#f0f0f0':'var(--gold)';
    const entEvents = world.events.filter(ev => ev.entity === e.name).slice(0, 15);
    const entTells = world.tells.filter(t => t.from === e.name || t.to === e.name).slice(0, 8);
    document.getElementById('ctx-title').textContent = e.name;

    let h = `<div class="ctx-name" style="color:${c}">${e.name}</div>`;

    // Status
    h += `<div class="cas"><div class="cas-hdr" onclick="toggleCas(this)"><span class="cas-arrow">v</span> Status</div><div class="cas-body">`;
    h += `<div class="ctx-row"><span class="ctx-k">state</span><span class="ctx-v" style="color:${STATE_COLORS[e.state]||'#888'}">${e.state}</span></div>`;
    h += `<div class="ctx-row"><span class="ctx-k">model</span><span class="ctx-v">${e.model}</span></div>`;
    h += `<div class="ctx-row"><span class="ctx-k">rank</span><span class="ctx-v gold">${e.rank}</span></div>`;
    h += `<div class="ctx-row"><span class="ctx-k">room</span><span class="ctx-v" style="cursor:pointer;color:var(--amber)" onclick="openContext('room','${e.room}')">${world.rooms[e.room]?.name||e.room}</span></div>`;
    h += `<div class="ctx-row"><span class="ctx-k">focus</span><span class="ctx-v">${e.focus}</span></div>`;
    if (e.success) h += `<div class="ctx-row"><span class="ctx-k">success</span><span class="ctx-v ${e.success>85?'green':e.success<70?'red':''}">${e.success}%</span></div>`;
    if (e.cmds) h += `<div class="ctx-row"><span class="ctx-k">commands</span><span class="ctx-v">${e.cmds}</span></div>`;
    h += `</div></div>`;

    // Memory
    if (e.memory && e.memory.length) {
      h += `<div class="cas"><div class="cas-hdr" onclick="toggleCas(this)"><span class="cas-arrow">v</span> Core Memory (${e.memory.length})</div><div class="cas-body">`;
      e.memory.forEach(m => h += `<div class="ctx-mem"><div class="ctx-mk">${m.k}</div><div class="ctx-mv">${m.v}</div></div>`);
      h += `</div></div>`;
    }

    // Room context (clickable)
    const roommates = Object.entries(world.entities).filter(([eid,ent]) => ent.room === e.room && eid !== id);
    if (roommates.length) {
      h += `<div class="cas"><div class="cas-hdr" onclick="toggleCas(this)"><span class="cas-arrow">v</span> In Room With (${roommates.length})</div><div class="cas-body">`;
      roommates.forEach(([eid,ent]) => {
        h += `<div class="ctx-item" onclick="openContext('entity','${eid}')" style="display:flex;align-items:center;gap:6px;padding:3px 0">
          <span style="width:6px;height:6px;border-radius:50%;background:${ent.kind==='agent'?'var(--gold)':ent.kind==='human'?'#f0f0f0':'var(--green)'};flex-shrink:0"></span>
          <span style="color:var(--bright)">${ent.name}</span>
          <span style="font-size:12px;color:${STATE_COLORS[ent.state]||'#888'}">${ent.state}</span>
        </div>`;
      });
      h += `</div></div>`;
    }

    // Direct messages
    if (entTells.length) {
      h += `<div class="cas"><div class="cas-hdr" onclick="toggleCas(this)"><span class="cas-arrow">v</span> Direct Messages (${entTells.length})</div><div class="cas-body">`;
      entTells.forEach(t => h += `<div style="padding:3px 0;font-size:14px;border-bottom:1px solid rgba(17,17,24,0.2)"><span style="color:var(--gold)">${t.from}</span><span style="color:#444;padding:0 3px">→</span><span style="color:var(--cyan)">${t.to}</span><div style="color:#888;font-size:13px">${t.text}</div></div>`);
      h += `</div></div>`;
    }

    // Activity
    h += `<div class="cas"><div class="cas-hdr" onclick="toggleCas(this)"><span class="cas-arrow">v</span> Activity (${entEvents.length})</div><div class="cas-body">`;
    if (entEvents.length) entEvents.forEach(ev => h += `<div class="fi" style="padding:2px 0"><span class="fi-t">${ev.time}</span><span class="fi-a${ev.isError?' err':''}">${ev.action}</span></div>`);
    else h += `<div style="color:#333;padding:4px 0">No recent activity</div>`;
    h += `</div></div>`;

    body.innerHTML = h;

  } else if (type === 'canvas') {
    const cn = world.canvasNodes[id]; if (!cn) return;
    const room = world.rooms[cn.room];
    const c = cn.intent ? (INTENT_COLORS[cn.intent.status] || cn.color) : cn.color;
    document.getElementById('ctx-title').textContent = cn.title;

    let h = `<div class="ctx-name" style="color:${c}">${cn.title}</div>`;
    h += `<div class="ctx-desc" style="color:${c};opacity:.6">${cn.type} node</div>`;

    // ═══ INLINE MEDIA PREVIEW ═══
    if (cn.type === 'image') {
      h += `<div style="padding:8px 12px">
        <div style="width:100%;aspect-ratio:16/10;background:linear-gradient(135deg,rgba(${hexToRgb(c)},0.08),rgba(${hexToRgb(c)},0.02));border:1px solid rgba(${hexToRgb(c)},0.2);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;overflow:hidden">
          <svg width="48" height="48" viewBox="0 0 48 48"><rect width="48" height="48" rx="4" fill="none" stroke="${c}" stroke-width="1" opacity=".3"/><polygon points="8,36 18,20 24,28 30,16 40,36" fill="${c}" opacity=".15"/><circle cx="34" cy="14" r="5" fill="${c}" opacity=".15"/></svg>
          <span style="font-size:clamp(11px,0.75vw,14px);color:#666">${cn.title}</span>
          <span style="font-size:clamp(9px,0.6vw,11px);color:#444">click to expand full-size</span>
        </div>
      </div>`;
    } else if (cn.type === 'video') {
      h += `<div style="padding:8px 12px">
        <div style="width:100%;aspect-ratio:16/9;background:#0a0a0f;border:1px solid rgba(${hexToRgb(c)},0.2);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden">
          <svg width="56" height="56" viewBox="0 0 56 56" style="opacity:.6"><circle cx="28" cy="28" r="24" fill="none" stroke="${c}" stroke-width="2"/><polygon points="22,16 22,40 42,28" fill="${c}" opacity=".5"/></svg>
          <span style="font-size:clamp(11px,0.75vw,14px);color:#666;margin-top:6px">${cn.title}</span>
          ${cn.media?`<span style="font-size:clamp(9px,0.6vw,11px);color:#444">${cn.media.duration||''} ${cn.media.poster?'— '+cn.media.poster:''}</span>`:''}
          <div style="position:absolute;bottom:0;left:0;right:0;height:32px;background:rgba(0,0,0,0.5);display:flex;align-items:center;padding:0 10px;gap:8px">
            <span style="font-size:18px;color:${c};cursor:pointer">▶</span>
            <div style="flex:1;height:3px;background:#333;border-radius:2px"><div style="width:0%;height:100%;background:${c};border-radius:2px"></div></div>
            <span style="font-size:clamp(9px,0.6vw,10px);color:#666">${cn.media?.duration||'0:00'}</span>
          </div>
        </div>
      </div>`;
    } else if (cn.type === 'audio') {
      h += `<div style="padding:8px 12px">
        <div style="width:100%;background:#0a0a0f;border:1px solid rgba(${hexToRgb(c)},0.2);border-radius:4px;padding:12px;display:flex;align-items:center;gap:10px">
          <span style="font-size:24px;color:${c};cursor:pointer;flex-shrink:0">▶</span>
          <div style="flex:1">
            <div style="font-size:clamp(13px,0.83vw,16px);color:var(--bright)">${cn.title}</div>
            <div style="display:flex;align-items:end;gap:2px;height:28px;margin-top:6px">
              ${Array.from({length:32},(_,i)=>{const h=4+Math.random()*20;return`<div style="width:3px;height:${h}px;background:${c};opacity:${0.2+Math.random()*0.3};border-radius:1px"></div>`}).join('')}
            </div>
            <div style="display:flex;justify-content:space-between;margin-top:4px">
              <span style="font-size:clamp(9px,0.6vw,10px);color:#444">0:00</span>
              <span style="font-size:clamp(9px,0.6vw,10px);color:#444">${cn.media?.duration||'0:00'}</span>
            </div>
          </div>
        </div>
      </div>`;
    } else if (cn.type === 'pdf') {
      h += `<div style="padding:8px 12px">
        <div style="width:100%;aspect-ratio:8.5/11;max-height:300px;background:#111;border:1px solid rgba(${hexToRgb(c)},0.2);border-radius:4px;display:flex;flex-direction:column;overflow:hidden">
          <div style="padding:10px 14px;flex:1;overflow-y:auto">
            <div style="font-size:clamp(12px,0.83vw,16px);color:var(--bright);font-weight:bold;margin-bottom:8px">Canvas-Map Convergence Spec</div>
            <div style="font-size:clamp(10px,0.68vw,12px);color:#666;line-height:1.6">
              <p style="margin-bottom:6px">1. Introduction — This document outlines the convergence of the canvas and dashboard into a unified world map visualization.</p>
              <p style="margin-bottom:6px">2. Architecture — Room structures rendered as geometric forms with activity-driven spinning rings. Canvas nodes overlay the world layer.</p>
              <p style="margin-bottom:6px">3. Interaction Model — Click to inspect, drag to move, pinch to zoom. All elements are interactive and navigable.</p>
              <p style="color:#444">...</p>
            </div>
          </div>
          <div style="padding:6px 14px;border-top:1px solid #222;display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
            <span style="font-size:clamp(9px,0.6vw,10px);color:#444">Page 1 of 8</span>
            <span style="font-size:clamp(9px,0.6vw,10px);color:${c};cursor:pointer">open full viewer →</span>
          </div>
        </div>
      </div>`;
    } else if (cn.type === 'document') {
      h += `<div style="padding:8px 12px">
        <div style="width:100%;background:#0a0a0f;border:1px solid rgba(${hexToRgb(c)},0.2);border-radius:4px;padding:12px 14px;max-height:200px;overflow-y:auto">
          <div style="font-size:clamp(11px,0.75vw,14px);color:#888;line-height:1.6">
            <p style="margin-bottom:6px;color:var(--bright)">Document content would render here with the Tiptap rich text editor — supporting headings, lists, code blocks, links, and inline formatting.</p>
            <p style="color:#666">Editable by humans, publishable by agents via <span style="color:var(--cyan)">canvas publish document</span>.</p>
          </div>
        </div>
      </div>`;
    }

    // Properties
    h += `<div class="cas"><div class="cas-hdr" onclick="toggleCas(this)"><span class="cas-arrow">v</span> Properties</div><div class="cas-body">`;
    h += `<div class="ctx-row"><span class="ctx-k">type</span><span class="ctx-v">${cn.type}</span></div>`;
    h += `<div class="ctx-row"><span class="ctx-k">origin</span><span class="ctx-v" style="color:${cn.origin==='imported'?'var(--rose)':'var(--cyan)'}">${cn.origin==='imported'?'imported (drag-drop)':'agent-created'}</span></div>`;
    h += `<div class="ctx-row"><span class="ctx-k">room</span><span class="ctx-v" style="cursor:pointer;color:var(--amber)" onclick="openContext('room','${cn.room}')">${room?.name||cn.room}</span></div>`;
    h += `</div></div>`;

    // Intent details (if present)
    if (cn.intent) {
      const ic = INTENT_COLORS[cn.intent.status];
      h += `<div class="cas"><div class="cas-hdr" onclick="toggleCas(this)"><span class="cas-arrow">v</span> Intent</div><div class="cas-body">`;
      h += `<div class="ctx-row"><span class="ctx-k">status</span><span class="ctx-v" style="color:${ic};font-weight:bold">${cn.intent.status}</span></div>`;
      if (cn.intent.claimedBy) h += `<div class="ctx-row"><span class="ctx-k">claimed by</span><span class="ctx-v" style="cursor:pointer;color:var(--gold)" onclick="openContext('entity','${Object.entries(world.entities).find(([,e])=>e.name===cn.intent.claimedBy)?.[0]||''}')">${cn.intent.claimedBy}</span></div>`;
      h += `<div style="padding:6px 0;font-size:14px;color:#888;border-top:1px solid rgba(17,17,24,0.2);margin-top:4px"><div style="font-size:11px;color:var(--cyan);margin-bottom:2px">prompt</div>${cn.intent.prompt}</div>`;
      h += `</div></div>`;
    }

    // Related canvas nodes in same room
    const siblings = Object.entries(world.canvasNodes).filter(([cid,c]) => c.room === cn.room && cid !== id);
    if (siblings.length) {
      h += `<div class="cas"><div class="cas-hdr" onclick="toggleCas(this)"><span class="cas-arrow">v</span> Also in ${room?.name||cn.room} (${siblings.length})</div><div class="cas-body">`;
      siblings.forEach(([cid,sib]) => {
        const sc = sib.intent ? INTENT_COLORS[sib.intent.status] : sib.color;
        h += `<div class="ctx-item" onclick="openContext('canvas','${cid}')" style="display:flex;align-items:center;gap:6px;padding:3px 0">
          <span style="color:${sc};font-size:14px">${{intent:'◆',a2ui:'▣',image:'◻',video:'▶',audio:'♫',pdf:'▧',document:'▪',text:'·'}[sib.type]||'▪'}</span>
          <span style="color:var(--bright)">${sib.title}</span>
          ${sib.intent?`<span style="font-size:11px;color:${sc};margin-left:auto">${sib.intent.status}</span>`:''}
        </div>`;
      });
      h += `</div></div>`;
    }

    body.innerHTML = h;
  }
}

// Keep context panel live-updating
function refreshContext() {
  if (currentCtx) renderContext();
}

// ═══ FULL VIEWER — double-click to open items for real work ═══

  const v = document.getElementById('viewer');

  if (type === 'canvas') {
    const cn = world.canvasNodes[id];
    if (!cn) return;
    title.textContent = cn.title;
    typeBadge.textContent = cn.type;

function searchWorld(q){
  const results=[];
  // Search entities
  for(const[id,e]of Object.entries(world.entities)){
    if(e.name.toLowerCase().includes(q)||e.model.toLowerCase().includes(q)||e.focus.toLowerCase().includes(q)||e.rank.toLowerCase().includes(q))
      results.push({type:'entity',id,name:e.name,detail:`${e.kind} · ${e.state} · ${world.rooms[e.room]?.name||e.room}`});
  }
  // Search rooms
  for(const[id,r]of Object.entries(world.rooms)){
    if(r.name.toLowerCase().includes(q)||r.district.toLowerCase().includes(q))
      results.push({type:'room',id,name:r.name,detail:`${r.district} · ${r.throughput} msg/hr`});
  }
  // Search canvas nodes
  for(const[id,cn]of Object.entries(world.canvasNodes)){
    if(cn.title.toLowerCase().includes(q)||cn.type.toLowerCase().includes(q)||(cn.intent?.prompt||'').toLowerCase().includes(q))
      results.push({type:'canvas',id,name:cn.title,detail:`${cn.type}${cn.intent?' · '+cn.intent.status:''} · ${world.rooms[cn.room]?.name||cn.room}`});
  }
  // Search projects
  for(const p of world.projects){
    if(p.name.toLowerCase().includes(q)) results.push({type:'project',id:null,name:p.name,detail:p.agents});
  }

  if(!results.length){appendCmdMsg(null,`No results for "${q}"`,true,'cmd');return}

  appendCmdMsg(null,`Search "${q}" — ${results.length} results:`,true,'cmd');
  for(const r of results){
    const clickAttr=r.id?`onclick="openContext('${r.type}','${r.id}')" style="cursor:pointer;color:var(--bright)"`:` style="color:#888"`;
    appendCmdMsg(null,`<span ${clickAttr}>${{entity:'●',room:'◆',canvas:'▪',project:'◉'}[r.type]||'·'} ${r.name}</span> <span style="color:#444">— ${r.detail}</span>`,true,'cmd');
  }
  // Auto-zoom to first result
  if(results[0]?.id) openContext(results[0].type, results[0].id);
}

function sendCmd(){
  const inp=document.getElementById('cmd-bar-input');
  const raw=inp.value.trim();if(!raw)return;inp.value='';
  // Echo the command in the message area
  appendCmdMsg(null,raw,false,'cmd');

  // Parse command
  const parts=raw.split(/\s+/);
  const cmd=parts[0].toLowerCase();
  const args=parts.slice(1).join(' ');

  // Route to appropriate handler
  if(cmd==='say') {
    addChatMsg('juno',args||raw);
    addEvent('juno',`say "${(args||raw).substring(0,40)}"`);
  } else if(cmd==='tell') {
    const m=args.match(/^(\S+)\s+(.+)/);
    if(m){addTell('juno',m[1],m[2])}
    else{addChatMsg(null,'Usage: tell <name> <message>',true)}
  } else if(cmd==='goto'||cmd==='go') {
    const target=Object.entries(world.rooms).find(([id,r])=>r.name.toLowerCase().includes(args.toLowerCase()));
    if(target){
      world.entities.juno.room=target[0];
      addEvent('juno',`goto "${target[1].name}"`);
      addChatMsg(null,`You moved to ${target[1].name}.`,true);
      openContext('room',target[0]);
      renderAllRooms();renderRoster();
    } else addChatMsg(null,`No room matching "${args}".`,true);
  } else if(cmd==='look') {
    const r=world.rooms[world.entities.juno.room];
    if(r) openContext('room',world.entities.juno.room);
  } else if(cmd==='recall'||cmd==='search') {
    addEvent('juno',`recall "${args}" -- ${1+Math.floor(Math.random()*5)} notes`);
    addChatMsg(null,`Recall results for "${args}": ${1+Math.floor(Math.random()*5)} notes found.`,true);
  } else if(cmd==='note') {
    addEvent('juno',`note ${args}`);
    addChatMsg(null,`Note: ${args}`,true);
  } else if(cmd==='who'||cmd==='entities') {
    const ents=Object.values(world.entities);
    addChatMsg(null,`${ents.length} entities online: ${ents.map(e=>e.name).join(', ')}`,true);
  } else if(cmd==='rooms') {
    addChatMsg(null,Object.values(world.rooms).map(r=>`${r.name} (${r.throughput} msg/hr)`).join(', '),true);
  } else if(cmd==='help') {
    addChatMsg(null,'Commands: say, tell, goto, look, recall, note, who, rooms, search, brief, task, canvas, web, help — 67+ total',true);
  } else if(cmd==='search'||cmd==='find'||cmd==='?'||raw.startsWith('?')) {
    const q = (cmd==='?'?raw.slice(1):args).trim().toLowerCase();
    if(!q){addChatMsg(null,'Usage: search <query> or ?<query>',true);return}
    searchWorld(q);
  } else {
    // Pass through as generic command
    addEvent('juno',raw);
    addChatMsg(null,`> ${raw}`,true);
  }
}

function simulateEvent(){

  const[id,agent]=agents[Math.floor(Math.random()*agents.length)];

      addTell(agent.name,target.name,msgs[Math.floor(Math.random()*msgs.length)]);

    };

  // Occasionally spawn a new room (demonstrates dynamic layout)

      world.rooms[id] = { name, x:0, y:0, district:districts[names.indexOf(name)], exits:[connectTo], throughput:5+Math.floor(Math.random()*20), source:'// Dynamically created room' };

  if (Math.random() < 0.03) {

    addEvent(agent.name, `canvas publish ${type} "${title}" → ${world.rooms[roomId]?.name}`);
  }

  world.uptime++;
  trimActivity();autoLayout();renderWorldRing();renderAllRooms();renderFlows();renderContours();renderCanvasNodes();renderRelations();renderInteractions();renderRoster();renderCompass();renderMetrics();
  refreshContext();
}
