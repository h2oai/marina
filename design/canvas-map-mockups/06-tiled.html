function setupDivider(divId, target, prop, dir) {
  const div = document.getElementById(divId);
  let active = false, start, startSize;
  div.addEventListener('mousedown', e => {
    active = true; div.classList.add('active');
    start = dir === 'h' ? e.clientY : e.clientX;
    startSize = target[dir === 'h' ? 'offsetHeight' : 'offsetWidth'];
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!active) return;
    const delta = (dir === 'h' ? e.clientY : e.clientX) - start;
    const newSize = Math.max(prop === 'height' ? 80 : 120, startSize + (prop === 'height' ? -delta : delta));
    target.style[prop] = newSize + 'px';
  });
  document.addEventListener('mouseup', () => { active = false; div.classList.remove('active'); });
}

const mapTile=document.getElementById('map-tile'),svg=document.getElementById('world-svg');

// Compute center of all room content dynamically
function worldCenter(){
  const rooms=Object.values(world.rooms);
  if(!rooms.length) return {x:800,y:550};
  let x=0,y=0;
  rooms.forEach(r=>{x+=r.x;y+=r.y});
  return {x:x/rooms.length, y:y/rooms.length};
}

function updateTransform(){
  const cx=mapTile.clientWidth/2,cy=mapTile.clientHeight/2;
  const wc=worldCenter();
  svg.style.transform='translate('+(panX-wc.x*scale+cx)+'px,'+(panY-wc.y*scale+cy)+'px) scale('+scale+')';
}

function zoomIn(){scale=Math.min(3,scale*1.25);updateTransform()}
function zoomOut(){scale=Math.max(0.15,scale/1.25);updateTransform()}

}

// ═══ DRAG-DROP FILE UPLOAD ═══
const MIME_MAP = {'image/':'image','video/':'video','audio/':'audio','application/pdf':'pdf'};
function mimeToType(mime){for(const[k,v]of Object.entries(MIME_MAP))if(mime.startsWith(k))return v;return'document'}

mapTile.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';mapTile.classList.add('dragover')});
mapTile.addEventListener('dragleave',e=>{mapTile.classList.remove('dragover')});
mapTile.addEventListener('drop',e=>{
  e.preventDefault();mapTile.classList.remove('dragover');
  const files=e.dataTransfer.files;if(!files.length)return;

  // Convert screen position to SVG world coords
  const wc=worldCenter();
  const cx=mapTile.clientWidth/2,cy=mapTile.clientHeight/2;
  const worldX=wc.x+(e.clientX-mapTile.getBoundingClientRect().left-cx-panX)/scale;
  const worldY=wc.y+(e.clientY-mapTile.getBoundingClientRect().top-cy-panY)/scale;

  // Find nearest room
  let nearestRoom='nexus',nearestDist=Infinity;
  for(const[id,r]of Object.entries(world.rooms)){
    const d=Math.hypot(r.x-worldX,r.y-worldY);
    if(d<nearestDist){nearestDist=d;nearestRoom=id}
  }

  for(const file of files){
    const type=mimeToType(file.type);
    const nid=`import-${Date.now()}-${Math.random().toString(36).slice(2,6)}`;
    const room=world.rooms[nearestRoom];
    world.canvasNodes[nid]={
      type, title:file.name, room:nearestRoom,
      ox:worldX-room.x, oy:worldY-room.y,
      color:'var(--rose)', origin:'imported', _pinned:true,
      media:type==='video'||type==='audio'?{duration:'--:--'}:null
    };
    addEvent('juno',`dropped ${type}: "${file.name}" → ${room.name}`);

    const id = (el.closest('g[data-drag]')||el).getAttribute('data-id');

    e.preventDefault(); e.stopPropagation();
  } else {

  }
});

mapTile.addEventListener('mousedown',e=>{
  const el = e.target.closest('[data-drag]');
  if (el) {
    // Start potential drag on a world element
    dragTarget = el.closest('g[data-drag]') || el;
    dragType = dragTarget.getAttribute('data-drag');
    dragId = dragTarget.getAttribute('data-id');
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragMoved = false;
    e.preventDefault();
    e.stopPropagation();
  } else {
    // Pan the map
    isPan=true;sx=e.clientX-panX;sy=e.clientY-panY;e.preventDefault();
  }
});

document.addEventListener('mousemove',e=>{
  if (isPan) { panX=e.clientX-sx;panY=e.clientY-sy;updateTransform(); return; }
  if (!dragTarget) return;

  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;

  if (!dragMoved && Math.abs(dx) + Math.abs(dy) > DRAG_THRESHOLD) {
    dragMoved = true;
    dragTarget.style.cursor = 'grabbing';
  }

  if (dragMoved) {
    // Convert delta to SVG world units
    const worldDx = dx / scale;
    const worldDy = dy / scale;

    if (dragType === 'room') {
      const room = world.rooms[dragId];
      if (room) {
        const orig = room._origX ?? room.x;
        const origY = room._origY ?? room.y;
        if (!room._origX) { room._origX = room.x; room._origY = room.y; }
        room.x = orig + worldDx;
        room.y = origY + worldDy;
      }
    } else if (dragType === 'canvas') {
      const cn = world.canvasNodes[dragId];
      if (cn) {
        if (cn._origOx === undefined) { cn._origOx = cn.ox; cn._origOy = cn.oy; }
        cn.ox = cn._origOx + worldDx;
        cn.oy = cn._origOy + worldDy;
      }
    }
    // Live re-render while dragging
    renderAllRooms(); renderFlows(); renderContours(); renderCanvasNodes(); renderRelations();
  }
});

document.addEventListener('mouseup',e=>{
  if (isPan) { isPan=false; return; }
  if (dragTarget) {
    if (!dragMoved) {
      // It was a click, not a drag
      openContext(dragType, dragId);
    } else {
      // Commit the new position, clear origin tracking
      if (dragType === 'room') {
        const room = world.rooms[dragId];
        if (room) { delete room._origX; delete room._origY; room._pinned = true; }
      } else if (dragType === 'canvas') {
        const cn = world.canvasNodes[dragId];
        if (cn) { delete cn._origOx; delete cn._origOy; cn._pinned = true; }
      }
    }
    if (dragTarget.style) dragTarget.style.cursor = '';
    dragTarget = null; dragType = null; dragId = null;
  }
});

// Command bar drag
(function(){
  const bar=document.getElementById('cmd-bar');
  const handle=document.getElementById('cmd-bar-drag');
  let dragging=false,ox,oy;
  handle.addEventListener('mousedown',e=>{

  });

  handle.addEventListener('touchstart',e=>{

    const r=bar.getBoundingClientRect();
    bar.style.left=r.left+'px';bar.style.top=r.top+'px';
    bar.style.bottom='auto';bar.style.right='auto';bar.style.transform='none';
    ox=e.touches[0].clientX-r.left;oy=e.touches[0].clientY-r.top;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!dragging||!e.touches.length)return;
    bar.style.left=(e.touches[0].clientX-ox)+'px';bar.style.top=(e.touches[0].clientY-oy)+'px';
  },{passive:true});
  document.addEventListener('touchend',()=>{dragging=false;resizing=false});

  // Resize
  const rh=document.getElementById('cmd-bar-resize');
  let resizing=false,rsx,rsy,rsw,rsh;
  function fixBar(){
    const r=bar.getBoundingClientRect();
    bar.style.left=r.left+'px';bar.style.top=r.top+'px';
    bar.style.width=r.width+'px';bar.style.height=r.height+'px';
    bar.style.bottom='auto';bar.style.right='auto';bar.style.transform='none';
  }
  rh.addEventListener('mousedown',e=>{
    resizing=true;fixBar();
    rsw=bar.offsetWidth;rsh=bar.offsetHeight;rsx=e.clientX;rsy=e.clientY;
    e.preventDefault();e.stopPropagation();
  });
  document.addEventListener('mousemove',e=>{
    if(!resizing)return;
    bar.style.width=Math.max(300,rsw+(e.clientX-rsx))+'px';

function openCmdBar() {
  cmdInput.focus();

function closeCmdBar() {
  cmdInput.blur();

function cmdBarKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const val = cmdInput.value.trim();
    if (val) {
      sendCmd();
      cmdHistoryList.push(val);
      cmdHistoryIdx = -1;
      cmdHistorySaved = '';
    }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (cmdHistoryList.length === 0) return;
    if (cmdHistoryIdx === -1) cmdHistorySaved = cmdInput.value;
    cmdHistoryIdx = Math.min(cmdHistoryIdx + 1, cmdHistoryList.length - 1);
    cmdInput.value = cmdHistoryList[cmdHistoryList.length - 1 - cmdHistoryIdx];
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (cmdHistoryIdx <= 0) { cmdHistoryIdx = -1; cmdInput.value = cmdHistorySaved; return; }
    cmdHistoryIdx--;
    cmdInput.value = cmdHistoryList[cmdHistoryList.length - 1 - cmdHistoryIdx];
  }
}

let panelFadeTimers = {};
function resetPanelFade(panelId, delay) {
  const el = document.getElementById(panelId);
  if (!el) return;
  el.classList.remove('faded');
  clearTimeout(panelFadeTimers[panelId]);
  panelFadeTimers[panelId] = setTimeout(() => {
    if (!el.matches(':hover')) el.classList.add('faded');
  }, delay || 6000);
}

  // Start faded after initial delay
  resetPanelFade(p.id, 4000);
});

// ═══ KEYBOARD ═══
document.addEventListener('keydown',e=>{
  const tag = document.activeElement.tagName;
  const inInput = tag==='INPUT'||tag==='TEXTAREA';
  const barVisible = !cmdBar.classList.contains('hidden');

  // / toggles command bar visibility
  if (e.key==='/') {
    if (inInput && document.activeElement === cmdInput) {
      // Already in command bar — hide it
      e.preventDefault(); cmdBar.classList.add('hidden'); cmdInput.blur(); return;
    } else if (!inInput) {
      // Not in any input — show and focus
      e.preventDefault(); cmdBar.classList.remove('hidden'); cmdInput.focus(); return;
    }
  }

  // Tab focuses command bar if visible
  if (e.key==='Tab' && !inInput && barVisible) {
    e.preventDefault(); cmdInput.focus(); return;
  }

  // Escape chain: viewer → context → blur input
  if (e.key==='Escape') {
    if (inInput) { cmdInput.blur(); return; }
    if (document.getElementById('viewer').classList.contains('open')) { closeViewer(); return; }
    if (currentCtx) { closeContext(); return; }
    return;
  }

  if (inInput) return;

  // Space = clear view toggle
  if (e.key===' ') { e.preventDefault(); toggleClearView(); return; }

  if(e.key==='h'||e.key==='H'||e.key==='Home')resetView();
  if(e.key==='e'||e.key==='E')toggleFP('fp-roster');
  if(e.key==='f'||e.key==='F')toggleFP('fp-feed');
  if(e.key==='a'||e.key==='A')toggleFP('fp-admin');
});

      <div class="ctx-row"><span class="ctx-k">groq</span><span class="ctx-v" style="color:#444">not configured</span></div>
      <div class="ctx-row"><span class="ctx-k">deepseek</span><span class="ctx-v" style="color:#444">not configured</span></div>
    </div>`;
  } else if(adminTab==='adapters'){
    ab.innerHTML=`<div style="padding:8px 12px">
      <div class="co"><div class="co-d" style="background:#444"></div><div style="flex:1"><div class="co-t">Discord</div><div class="co-m">not connected</div></div><button style="background:rgba(255,221,0,0.08);border:1px solid rgba(255,221,0,0.2);color:var(--gold);font-family:VT323;font-size:clamp(13px,0.9vw,17px);padding:2px 8px;cursor:pointer">Enable</button></div>
      <div class="co"><div class="co-d" style="background:#444"></div><div style="flex:1"><div class="co-t">Telegram</div><div class="co-m">not connected</div></div><button style="background:rgba(255,221,0,0.08);border:1px solid rgba(255,221,0,0.2);color:var(--gold);font-family:VT323;font-size:clamp(13px,0.9vw,17px);padding:2px 8px;cursor:pointer">Enable</button></div>
      <div class="co"><div class="co-d act"></div><div style="flex:1"><div class="co-t">WebSocket</div><div class="co-m">port 3300 · 3 clients</div></div></div>
      <div class="co"><div class="co-d act"></div><div style="flex:1"><div class="co-t">Telnet</div><div class="co-m">port 4000</div></div></div>
      <div class="co"><div class="co-d act"></div><div style="flex:1"><div class="co-t">MCP Server</div><div class="co-m">port 3301</div></div></div>
    </div>`;
  } else if(adminTab==='roles'){
    const roles=['researcher: web-research, analytical-thinking','builder: code-review, task-management','coordinator: social, leadership','analyst: data-analysis, pattern-recognition','general: canvas-watcher, social'];
    ab.innerHTML=`<div style="padding:8px 12px">${roles.map(r=>{
      const[name,traits]=r.split(':');
      return`<div style="padding:5px 0;border-bottom:1px solid rgba(17,17,24,0.2)"><div style="color:var(--bright);font-size:clamp(14px,1vw,20px)">${name.trim()}</div><div style="color:#555;font-size:clamp(12px,0.9vw,16px)">${traits.trim()}</div></div>`;
    }).join('')}</div>`;
  } else if(adminTab==='mcp'){
    const tools=['think','memory','recall','note','brief','say','tell','goto','look','who','rooms','task','canvas','web','goal','novelty','channel','board','pool','group','key','adapter','build'];
    ab.innerHTML=`<div style="padding:8px 12px"><div class="ctx-row"><span class="ctx-k">Tools</span><span class="ctx-v">${tools.length} registered</span></div><div style="padding:6px 0;display:flex;flex-wrap:wrap;gap:4px">${tools.map(t=>`<span style="font-size:clamp(12px,0.9vw,16px);padding:2px 6px;background:rgba(255,221,0,0.04);border:1px solid rgba(255,221,0,0.08);color:#888;border-radius:2px">${t}</span>`).join('')}</div></div>`;
  } else if(adminTab==='config'){
    ab.innerHTML=`<div style="padding:8px 12px">
      <div class="ctx-row"><span class="ctx-k">Rate limit WS</span><span class="ctx-v">5/sec</span></div>
      <div class="ctx-row"><span class="ctx-k">Rate limit API</span><span class="ctx-v">2/sec per IP</span></div>
      <div class="ctx-row"><span class="ctx-k">SSRF guard</span><span class="ctx-v" style="color:var(--green)">enabled</span></div>
      <div class="ctx-row"><span class="ctx-k">Gateway secret</span><span class="ctx-v" style="color:#444">not set</span></div>
      <div class="ctx-row"><span class="ctx-k">World</span><span class="ctx-v">${world.name}</span></div>
      <div class="ctx-row"><span class="ctx-k">Open API</span><span class="ctx-v" style="color:var(--amber)">dev mode</span></div>
      <div class="ctx-row"><span class="ctx-k">Dashboard</span><span class="ctx-v">port 3300</span></div>
    </div>`;
  }
}

// Also keep feed updated when events arrive
const _origAddEvent = addEvent;
addEvent = function(entity,action,isError){
  _origAddEvent(entity,action,isError);
  renderFeed();
};
</script>
